    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      errEl.textContent = body.error || "Could not post note.";
      errEl.style.display = "";
      return;
    }
    const note = await res.json();
    notesById.set(note.id, note);
    renderNotes();
    textEl.value = "";
  } catch {
    errEl.textContent = "Network error -- check your connection and try again.";
    errEl.style.display = "";
  } finally {
    newNoteSubmitting = false;
    submitBtn.removeAttribute("aria-disabled");
  }
});

// --- send chat message ---------------------------------------------------
// Chat has a single-active-session model (agents start/end sessions
// explicitly). Sending here silently starts a session if none is active --
// start_chat_session is idempotent (returns the already-active one if
// there is one), so this is safe to call unconditionally rather than
// racing a client-side "is one active" check against the server.
let chatSendSubmitting = false;
document.getElementById("chatComposeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (chatSendSubmitting) return;
  const errEl = document.getElementById("chatComposeError");
  errEl.style.display = "none";
  const input = document.getElementById("chatComposeInput");
  const text = input.value.trim();
  if (!text) return;
  const author = getAuthorName();
  if (!author) {
    errEl.textContent = "Enter your name at the top of the page first.";
    errEl.style.display = "";
    return;
  }
  chatSendSubmitting = true;
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.setAttribute("aria-disabled", "true");
  input.setAttribute("aria-disabled", "true");
  try {
    const prevSessionId = activeSession ? activeSession.id : null;
    let session = activeSession;
    if (!session || session.status !== "active") {
      const startRes = await fetch("/api/chat/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ started_by: author }),
      });
      if (!startRes.ok) throw new Error("start failed");
      session = await startRes.json();
      if (session.id !== prevSessionId) chatMessagesById = new Map(); // a genuinely different session than whatever we last had
      activeSession = session;
      renderChat();
    }
    const sendRes = await fetch("/api/chat/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: session.id, author, text }),
    });
    if (!sendRes.ok) {
      // The session ended between start and send (a race with the other
      // agent) -- surface it rather than silently dropping the message;
      // the next send attempt will start a fresh session on its own.
      errEl.textContent = "Could not send -- the session may have just ended. Try again.";
      errEl.style.display = "";
      return;
    }
    const msg = await sendRes.json();
    chatMessagesById.set(msg.id, msg);
    chatAtBottom = true;
    renderChat();
    input.value = "";
  } catch {
    errEl.textContent = "Network error -- check your connection and try again.";
    errEl.style.display = "";
  } finally {
    chatSendSubmitting = false;
    submitBtn.removeAttribute("aria-disabled");
    input.removeAttribute("aria-disabled");
  }
});

function renderNotes() {
  const notes = [...notesById.values()].sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  document.getElementById("notes").innerHTML = notes.length
    ? notes.map(n => `
        <div class="note" data-note-id="${n.id}">
          <div class="head"><b>${esc(n.author || "?")}</b> &middot; <time>${fmtTime(n.created_at)}</time></div>
          <div class="text">${esc(n.text)}</div>
        </div>`).join("")
    : `<div class="empty">no notes yet</div>`;
  renderNewCount("notes");
}

function renderChat() {
  // The panel itself is always visible now -- it doubles as the compose
  // entry point ("send a message to start a chat"), not just a viewer for
  // a session an agent already started (tranche: human composers). Only the
  // log content and status badge vary with activeSession.
  const panel = document.getElementById("chatPanel");
  panel.style.display = "";

  const log = document.getElementById("chatLog");
  // Read the real scroll position ONLY while the log is actually visible --
  // scrollHeight/scrollTop/clientHeight all read as 0 on a hidden element,
  // which would silently overwrite a genuine "user was at the bottom"
  // intent with a false one the instant the panel gets collapsed. While
  // hidden, chatAtBottom simply keeps whatever it was last set to
  // (OpenClaw's review).
  if (!log.hidden) {
    chatAtBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
  }

  // "collapsed by user preference" (the hidden attribute on #chatLog alone,
  // from applySectionCollapse) stays independent of session state -- a
  // newly-started session must reappear honoring whatever collapse state
  // was last chosen for it, never forced back open just because it
  // structurally exists again (OpenClaw's review). The compose form sits
  // outside #chatLog, so it stays usable even while the log is collapsed --
  // same choice as the notes composer.
  applySectionCollapse("panel:chat");

  const statusEl = document.getElementById("chatStatus");
  if (activeSession) {
    statusEl.style.display = "";
    statusEl.textContent = activeSession.status;
    statusEl.className = "chat-status " + activeSession.status;
  } else {
    statusEl.style.display = "none";
  }

  if (!activeSession) {
    log.innerHTML = `<div class="empty">No active chat &mdash; send a message below to start one.</div>`;
    renderNewCount("chat");
    return;
  }

  const msgs = [...chatMessagesById.values()].sort((a, b) => a.id - b.id);
  log.innerHTML = msgs.length
    ? msgs.map(m => `
        <div class="msg ${esc(m.author)}">
          <div class="head"><b>${esc(m.author || "?")}</b> &middot; <time>${fmtTime(m.created_at)}</time></div>
          <div class="bubble">${esc(m.text)}</div>
        </div>`).join("")
    : `<div class="empty">session started, no messages yet</div>`;
  // Meaningless while hidden (no layout box to scroll) -- but harmless to
  // attempt, and correct for the common "visible and at bottom" case. The
  // collapsed-then-expanded case is handled separately in toggleSection(),
  // since scrollTop can only take effect once the element has real layout.
  if (chatAtBottom) log.scrollTop = log.scrollHeight;
  renderNewCount("chat");
}

function renderNewCount(section) {
  const elId = { tasks: "tasksNew", notes: "notesNew", chat: "chatNew" }[section];
  const el = document.getElementById(elId);
  const n = newCounts[section];
  if (n > 0) { el.style.display = ""; el.textContent = `${n} new`; }
  else { el.style.display = "none"; }
}

// Presence: rendered on its own 5s timer (not tied to event/network traffic)
// so an agent that's gone quiet visibly flips to offline even with zero new
// events -- last_seen alone can't do that without a timer independent of
// when data last arrived (OpenClaw's review, point 6).
function renderPresence() {
  const rows = [...presenceByAgent.values()].sort((a, b) => (a.last_seen < b.last_seen ? 1 : -1));
  const el = document.getElementById("presence");
  el.innerHTML = rows.length
    ? rows.map(p => {
        const online = (Date.now() - new Date(p.last_seen).getTime()) < 30000;
        return `
          <div class="presence-row">
            <span class="presence-dot ${online ? "online" : "offline"}"></span>
            <b>${esc(p.agent)}</b>
            <span class="last">${online ? "online" : relTime(p.last_seen)}</span>
          </div>`;
      }).join("")
    : `<div class="empty">no activity yet</div>`;
}

// --- data loading -------------------------------------------------------

async function fetchTask(taskId) {
  try {
    const res = await fetch(`/api/tasks/${taskId}`, { cache: "no-store" });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function fetchPresence() {
  try {
    const res = await fetch("/api/presence", { cache: "no-store" });
    const rows = await res.json();
    for (const p of rows) presenceByAgent.set(p.agent, p);
    renderPresence();
  } catch { /* independent of SSE health; just skip this tick */ }
}

// True once the very first resync (the initial page load) has completed.
// Guards the badge-diffing below -- the initial load must not count
// everything already on the board as "new".
let hasLoadedOnce = false;

// Full atomic resync -- used for the very first load, and again whenever the
// stream recovers from an outage, so anything missed during a gap gets
// reconciled rather than silently staying stale (review point 5/8).
//
// Badge semantics must hold here too, not just on the live-event path: data
// that arrived while SSE was down (polling fallback) or that a recovery
// resync jumped over would otherwise show up on the board with 0 "new"
// count, silently violating "N new since page load" (OpenClaw's review,
// 2026-08-14). Fixed by diffing the OLD in-memory maps against the freshly
// fetched ones before overwriting: anything not already present (or, for
// tasks, present with a different updated_at) counts as new. Diffing against
// the current maps -- which already reflect anything the live-event path
// already counted -- means nothing already-live-applied gets double-counted.
async function fullResync() {
  const res = await fetch("/api/state", { cache: "no-store" });
  const data = await res.json();

  const newTasksById = new Map((data.tasks || []).map(t => [t.id, t]));
  const newNotesById = new Map((data.notes || []).map(n => [n.id, n]));

  if (hasLoadedOnce) {
    for (const [id, t] of newTasksById) {
      const old = tasksById.get(id);
      if (!old || old.updated_at !== t.updated_at) newCounts.tasks++;
    }
    for (const [id] of newNotesById) {
      if (!notesById.has(id)) newCounts.notes++;
    }
  }
  tasksById = newTasksById;
  notesById = newNotesById;
  for (const p of data.presence || []) presenceByAgent.set(p.agent, p);
  activeSession = data.latest_chat_session || null;

  if (activeSession) {
    try {
      const res2 = await fetch(`/api/chat/poll?session_id=${activeSession.id}&since=0`, { cache: "no-store" });
      const chatData = await res2.json();
      const newChatById = new Map((chatData.messages || []).map(m => [m.id, m]));
      if (hasLoadedOnce) {
        for (const [id] of newChatById) {
          if (!chatMessagesById.has(id)) newCounts.chat++;
        }
      }
      chatMessagesById = newChatById;
    } catch { /* chat panel just stays with whatever it had */ }
  } else {
    chatMessagesById = new Map();
  }

  hasLoadedOnce = true;
  renderBoard(); renderNotes(); renderChat(); renderPresence();
  return data.event_cursor || 0;
}

// Single-flight guard: the reconnect path and the 3s poll-fallback interval
// can otherwise both call fullResync() around the same moment (a reconnect
// attempt landing mid-interval), each independently rebuilding tasksById/etc
// from a separately-fetched snapshot -- redundant at best, and a source of
// visible flicker/lost-in-race updates at worst (OpenClaw's review,
// secondary point). Concurrent callers all await the one resync in flight.
let resyncPromise = null;
function fullResyncSingleFlight() {
  if (!resyncPromise) {
    resyncPromise = fullResync().finally(() => { resyncPromise = null; });
  }
  return resyncPromise;
}

// --- live event application ---------------------------------------------

// Serializes applyEvent calls into strict arrival order. Without this, two
// events landing close together (e.g. two addEventListener callbacks firing
// back to back) each kick off their own async task fetch, and those fetches
// can resolve out of order -- an earlier event's fetch completing after a
// later one's would silently stomp the newer state back to the older one
// (OpenClaw's review, point 3).
let applyQueue = Promise.resolve();
function queueApply(evt) {
  applyQueue = applyQueue.then(() => applyEvent(evt)).catch(() => {});
}

// Events are applied through a single-flight promise chain (queueApply, near
// the SSE wiring below), so this never runs concurrently with itself --
// otherwise two in-flight task fetches could resolve out of order and undo
// each other's effect on tasksById (OpenClaw's review, point 3).
async function applyEvent(evt) {
  if (evt.id <= lastAppliedEventId) return; // replay/duplicate -- already applied

  if (recoveryRequired) {
    // A gap is open below us that hasn't been closed by a successful resync
    // yet. Do NOT process this event on its own merits, even if its own
    // fetch would succeed -- that would let it commit a cursor past the
    // still-open gap underneath it, exactly the leapfrog OpenClaw's
    // re-review caught (a scheduled reconnect is not a closed gap; only a
    // successful resync is). Instead, retry the resync; each new event
    // arriving while gated becomes another retry attempt, on top of
    // connectSSE's own independent backoff cycle.
    try {
      const cursor = await fullResyncSingleFlight();
      lastAppliedEventId = Math.max(lastAppliedEventId, cursor);
      recoveryRequired = false;
    } catch { /* still broken -- stay gated; next event or the reconnect cycle retries */ }
    return;
  }

  const isNew = evt.id > pageLoadCursor;

  switch (evt.type) {
    case "task_created":
    case "task_updated":
    case "task_commented":
    case "checklist_item_added":
    case "checklist_item_updated":
    case "checklist_item_removed":
    case "attachment_added":
    case "attachment_removed": {
      const task = await fetchTask(evt.payload.task_id);
      if (!task) {
        // Transient fetch failure: open the recovery barrier immediately so
        // no other in-flight/incoming event can slip past this gap, then try
        // to close it with an awaited resync.
        recoveryRequired = true;
        try {
          const cursor = await fullResyncSingleFlight();
          lastAppliedEventId = Math.max(lastAppliedEventId, cursor);
          recoveryRequired = false;
        } catch {
          // The resync itself failed too -- force the SSE reconnect path in
          // the background (its own resync + backoff/retry), but do NOT
          // clear recoveryRequired here: "reconnect scheduled" is not "gap
          // closed" (OpenClaw's exact framing, second re-review 2026-08-14).
          // The barrier stays up until some future resync -- from here, from
          // a later gated event retrying, or from connectSSE's own eventual
          // success -- actually completes.
          if (es) { es.close(); }
          connectSSE();
        }
        return;
      }
      tasksById.set(task.id, task);
      if (isNew) newCounts.tasks++;
      renderBoard();
      break;
    }
    case "note_posted": {
      notesById.set(evt.payload.note_id, {
        id: evt.payload.note_id, author: evt.payload.author,
        text: evt.payload.text, created_at: evt.created_at,
      });
      if (isNew) newCounts.notes++;
      renderNotes();
      break;
    }
    case "chat_message": {
      if (activeSession && activeSession.id === evt.payload.session_id) {
        chatMessagesById.set(evt.payload.message_id, {
          id: evt.payload.message_id, session_id: evt.payload.session_id,
          author: evt.payload.author, text: evt.payload.text, created_at: evt.created_at,
        });
        if (isNew) newCounts.chat++;
        renderChat();
      }
      // Live-tail into an open transcript drawer too, if it's showing this
      // same session -- but only once the historical backlog has fully
      // loaded (see viewingBacklogComplete above); otherwise park it.
      if (viewingSessionId === evt.payload.session_id) {
        const msg = {
          id: evt.payload.message_id, session_id: evt.payload.session_id,
          author: evt.payload.author, text: evt.payload.text, created_at: evt.created_at,
        };
        if (viewingBacklogComplete) viewingMessages.set(msg.id, msg);
        else pendingLiveMessages.push(msg);
        renderTranscript();
      }
      // Keep the history list's message_count fresh without resetting
      // pagination (OpenClaw's review, point 3).
      refreshHistoryRow(evt.payload.session_id);
      break;
    }
    case "chat_session_started": {
      activeSession = { id: evt.payload.session_id, status: "active", started_by: evt.payload.started_by, linked_tasks: [] };
      chatMessagesById = new Map();
      renderChat();
      refreshHistoryList(); // a brand new session isn't a row refreshHistoryRow can patch -- needs the real page-1 fetch
      break;
    }
    case "chat_session_ended": {
      if (activeSession && activeSession.id === evt.payload.session_id) {
        activeSession = { ...activeSession, status: "ended" };
        renderChat();
      }
      // An open transcript for the session that just ended should reflect
      // the new status/duration immediately, not just next time it's
      // reopened (idempotent -- re-applying the same ended state is a no-op).
      if (viewingSessionId === evt.payload.session_id) {
        fetchSessionMeta(evt.payload.session_id).catch(() => {});
      }
      refreshHistoryList();
      break;
    }
    case "task_session_linked":
    case "task_session_unlinked": {
      // CRITICAL fix (OpenClaw's review pass 1): these two event types
      // existed server-side but were never registered as SSE listeners, so
      // link/unlink changes never reached the browser at all until an
      // unrelated resync happened to sweep them in.
      //
      // Pass 2 caught that the FIX still committed the cursor even when the
      // refresh calls failed silently (they were fire-and-forget with
      // internal catches) -- the same "commit before success confirmed" bug
      // class as the task-fetch path, just recurring here. Now awaited, and
      // any failure opens the same recoveryRequired barrier the task path
      // uses, rather than permanently acknowledging a relation change that
      // was never actually reflected in the UI.
      const taskId = evt.payload.task_id, sessionId = evt.payload.session_id;
      let ok = true;
      if (tasksById.has(taskId)) {
        const task = await fetchTask(taskId);
        if (task) { tasksById.set(task.id, task); renderBoard(); }
        else ok = false;
      }
      try {
        const res = await fetch(`/api/chat/sessions/${sessionId}`, { cache: "no-store" });
        if (!res.ok) throw new Error("fetch failed: " + res.status);
        const data = await res.json();
        if (historyPinnedActive && historyPinnedActive.id === sessionId) { historyPinnedActive = data; renderHistoryList(); }
        else {
          const idx = historySessions.findIndex(s => s.id === sessionId);
          if (idx !== -1) { historySessions[idx] = data; renderHistoryList(); }
        }
        if (viewingSessionId === sessionId) { viewingSessionMeta = data; renderTranscript(); }
      } catch {
        ok = false;
      }
      if (!ok) {
        recoveryRequired = true;
        try {
          const cursor = await fullResyncSingleFlight();
          lastAppliedEventId = Math.max(lastAppliedEventId, cursor);
          recoveryRequired = false;
          await refreshHistoryList(); // fullResync covers board/notes/chat/presence but not the history panel
        } catch {
          if (es) { es.close(); }
          connectSSE();
        }
        return; // skip the unconditional cursor commit below -- same discipline as the task-event recovery path
      }
      break;
    }
  }
  lastAppliedEventId = evt.id; // only commit the cursor after successful application
}

// --- connection lifecycle: SSE primary, polling fallback, manual backoff ---
// Deliberately not relying on EventSource's built-in auto-retry alone: we
// want a visible Live/Reconnecting/Polling indicator and a hard fallback to
// polling after repeated failures, with SSE and polling never both driving
// renders at the same time (review point 5).

let es = null;
let reconnectAttempts = 0;
let reconnectTimer = null;
let pollFallbackTimer = null;

function setConnStatus(state, label) {
  const el = document.getElementById("connStatus");
  el.className = "conn-status " + state;
  document.getElementById("connLabel").textContent = label;
}

function stopPollFallback() {
  if (pollFallbackTimer) { clearInterval(pollFallbackTimer); pollFallbackTimer = null; }
}

function startPollFallback() {
  if (pollFallbackTimer) return;
  setConnStatus("polling", "Polling");
  pollFallbackTimer = setInterval(() => { fullResyncSingleFlight().catch(() => {}); }, 3000);
}

async function connectSSE() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  // Pause the poll-fallback interval for the duration of this reconnect
  // attempt -- otherwise it can fire mid-attempt and race the resync below
  // even with the single-flight guard papering over the worst of it
  // (OpenClaw's review, secondary point). Resumes via startPollFallback()
  // below if this attempt also fails.
  stopPollFallback();

  let cursor;
  try {
    cursor = await fullResyncSingleFlight();
  } catch {
    setConnStatus("offline", "Offline");
    if (reconnectAttempts >= 3) startPollFallback();
    scheduleReconnect();
    return;
  }
  if (pageLoadCursor === 0 && lastAppliedEventId === 0) pageLoadCursor = cursor; // only on very first connect
  lastAppliedEventId = Math.max(lastAppliedEventId, cursor);
  recoveryRequired = false; // any successful full resync closes an open gap, whichever path triggered it

  if (es) { es.close(); }
  es = new EventSource(`/api/events/stream?since=${cursor}`);

  es.onopen = () => {
    reconnectAttempts = 0;
    stopPollFallback();
    setConnStatus("live", "Live");
  };
  // Server frames carry an explicit `event: <type>` field (added for spec
  // compliance/Last-Event-ID support -- see the SSE endpoint). Per the
  // EventSource spec, a named event type does NOT fire .onmessage, only
  // addEventListener(type, ...) -- learned this the hard way via a real
  // browser test, since curl-based testing can't tell the difference
  // (2026-08-14). Route every known type through the same handler, plus
  // .onmessage as a fallback for any frame sent without a type. Applied
  // events go through queueApply so out-of-order async fetches can't stomp
  // each other (see queueApply above).
  const onSSEMessage = (msg) => { queueApply(JSON.parse(msg.data)); };
  es.onmessage = (msg) => { try { onSSEMessage(msg); } catch { /* malformed frame */ } };
  for (const t of ["task_created", "task_updated", "task_commented", "note_posted",
                    "chat_message", "chat_session_started", "chat_session_ended",
                    "task_session_linked", "task_session_unlinked",
                    "checklist_item_added", "checklist_item_updated", "checklist_item_removed",
                    "attachment_added", "attachment_removed"]) {
    es.addEventListener(t, (msg) => { try { onSSEMessage(msg); } catch { /* malformed frame */ } });
  }
  es.onerror = () => {
    es.close();
    reconnectAttempts++;
    // Polling (if it kicks in) is the more informative state to show than a
    // generic "Reconnecting" that would otherwise overwrite it every retry
    // (OpenClaw's review, point 2) -- only announce "Reconnecting" while
    // still under the fallback threshold.
    if (reconnectAttempts >= 3) { startPollFallback(); }
    else { setConnStatus("reconnecting", "Reconnecting…"); }
    scheduleReconnect();
  };
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  const delay = Math.min(2000 * Math.pow(2, reconnectAttempts), 15000);
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connectSSE(); }, delay);
}

// --- section "N new" badges: click a header to clear its count ------------
document.getElementById("boardHeader").addEventListener("click", () => { newCounts.tasks = 0; renderNewCount("tasks"); });
// Ignore clicks that landed on the collapse-toggle button nested inside this
// same header -- merely collapsing/expanding must not clear the "N new"
// badge (OpenClaw's review: the document-level toggle listener fires AFTER
// this one in the bubble order, so it can't prevent this by itself; this
// check is the actual fix).
document.getElementById("notesHeader").addEventListener("click", (e) => {
  if (e.target.closest(".collapse-toggle")) return;
  newCounts.notes = 0; renderNewCount("notes");
});
document.getElementById("chatHeader").addEventListener("click", (e) => {
  if (e.target.closest(".collapse-toggle")) return;
  newCounts.chat = 0; renderNewCount("chat");
});
// Keeps chatAtBottom accurate for a manual scroll that happens with no
// render in between (e.g. scrolling up to read older messages, then
// collapsing without any new message arriving first) -- renderChat() alone
// only saw the DOM at its own call times, missing exactly that case
// (OpenClaw's review).
document.getElementById("chatLog").addEventListener("scroll", () => {
  const log = document.getElementById("chatLog");
  chatAtBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
});

// ---------------------------------------------------------------------------
// Chat history (tranche 2): session list + deep-linkable transcript drawer.
// The active session is pinned server-side in addition to the page limit
// (not counted against it) -- a deliberate reading of "pinned first" as
// "always visible", flagged explicitly for review rather than assumed.
// ---------------------------------------------------------------------------
// SESSION_ID_RE guards every place a session id is parsed from user-facing
// input (URL query param) rather than trusted server data -- "4junk" must
// not silently open session 4, and NaN must never reach a /NaN request
// (OpenClaw's review, point 5).
const SESSION_ID_RE = /^[1-9]\d*$/;
// Same shape as SESSION_ID_RE, applied to the ?message= deep-link param
// (tranche 3 -- a search hit opens ?session=N&message=M).
const MESSAGE_ID_RE = /^[1-9]\d*$/;

let historyPinnedActive = null; // the active session, kept separate from `sessions`
let historySessions = [];       // strictly <= the page limit -- limit is a hard max (OpenClaw's review, "pinned active" decision)
let historyCursor = null;
let historyHasMore = false;

let viewingSessionId = null;   // session id currently open in the drawer, or null
let viewingSessionMeta = null;
let viewingMessages = new Map();
let viewingNextAfterId = 0;
let viewingHasMore = false;
// Set when the drawer was opened onto a specific message (search hit) via
// the around-message endpoint, rather than the normal oldest-first load.
// Drives the scroll+highlight and the "Load earlier" control (tranche 3).
let viewingTargetMessageId = null;
let viewingEarliestLoadedId = null;
let viewingHasMoreBefore = false;
// While the historical backlog is still loading, live messages are parked
// here instead of spliced into viewingMessages -- otherwise the transcript
// would show [oldest loaded page] + [newest live message] with a hidden gap
// of un-fetched ids in between, looking contiguous when it isn't (OpenClaw's
// review, point 4). For an around-message window, "backlog complete" means
// has_more_after is false (nothing newer left to load), not the forward-
// pagination has_more used in the normal oldest-first mode.
let viewingBacklogComplete = false;
let pendingLiveMessages = [];

function fmtDuration(seconds) {
  if (seconds == null) return "ongoing";
  if (seconds < 60) return `${seconds}s`;
  const m = Math.floor(seconds / 60), s = seconds % 60;
  if (m < 60) return `${m}m ${s}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function linkChips(linkedTasks) {
  if (!linkedTasks || !linkedTasks.length) return "";
  return linkedTasks.map(t => `<span class="link-chip">#${t.task_id} ${esc(t.relation_type)}</span>`).join("");
}

async function fetchHistoryPage(cursor) {
  const qs = cursor != null ? `?cursor=${cursor}&limit=15` : `?limit=15`;
  const res = await fetch(`/api/chat/sessions${qs}`, { cache: "no-store" });
  return res.json();
}

async function refreshHistoryList() {
  const data = await fetchHistoryPage(null).catch(() => null);
  if (!data) return;
  historyPinnedActive = data.pinned_active;
  historySessions = data.sessions;
  historyCursor = data.next_cursor;
  historyHasMore = data.has_more;
  renderHistoryList();
}

async function loadMoreHistory() {
  if (!historyHasMore) return;
  const data = await fetchHistoryPage(historyCursor).catch(() => null);
  if (!data) return;
  const seen = new Set(historySessions.map(s => s.id));
  for (const s of data.sessions) if (!seen.has(s.id)) historySessions.push(s); // de-dupe any page-boundary overlap
  historyCursor = data.next_cursor;
  historyHasMore = data.has_more;
  renderHistoryList();
}

// Patches ONE row (in-place) without resetting pagination -- used for
// high-frequency updates (a new chat message ticking up message_count, a
// link/unlink changing chips) where refetching page 1 would be wasteful and
// would discard whatever pages the user has already loaded further down
// (OpenClaw's review, point 3).
async function refreshHistoryRow(sessionId) {
  try {
    const res = await fetch(`/api/chat/sessions/${sessionId}`, { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    if (historyPinnedActive && historyPinnedActive.id === sessionId) {
      historyPinnedActive = data;
      renderHistoryList();
      return;
    }
    const idx = historySessions.findIndex(s => s.id === sessionId);
    if (idx !== -1) {
      historySessions[idx] = data;
      renderHistoryList();
    }
    // Not found in either: session isn't loaded client-side yet (e.g. a page
    // further down than what's been fetched) -- nothing to patch, and it'll
    // show correctly whenever that page is actually loaded.
  } catch { /* best effort -- a stale row self-heals on the next full refresh */ }
}

function renderHistoryList() {
  const el = document.getElementById("historyList");
  const rows = (historyPinnedActive ? [historyPinnedActive] : []).concat(historySessions);
  // role="button" + tabindex + Enter/Space handling -- these were plain
  // unfocusable <div>s with only a click listener, so keyboard users
  // couldn't open a transcript at all (review pass 2, point 4).
  el.innerHTML = rows.length
    ? rows.map(s => `
        <div class="history-row" data-session-id="${s.id}" role="button" tabindex="0"
             aria-label="Open session ${s.id}, ${esc(s.status)}">
          <span class="hid">#${s.id}</span>
          <span class="htitle">${esc(s.status)} &middot; started by ${esc(s.started_by || "?")} ${linkChips(s.linked_tasks)}</span>
          <span class="hmeta">${s.message_count} msg &middot; ${fmtDuration(s.duration_seconds)}</span>
        </div>`).join("")
    : `<div class="empty">no sessions yet</div>`;
  for (const row of el.querySelectorAll(".history-row")) {
    const open = () => openTranscript(parseInt(row.dataset.sessionId, 10), true, row);
    row.addEventListener("click", open);
    row.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });
  }
  document.getElementById("historyLoadMore").style.display = historyHasMore ? "" : "none";
}

async function fetchSessionMeta(sessionId) {
  const res = await fetch(`/api/chat/sessions/${sessionId}`, { cache: "no-store" });
  if (!res.ok) throw new Error("session fetch failed: " + res.status);
  const data = await res.json();
  if (viewingSessionId === sessionId) {
    viewingSessionMeta = data;
    renderTranscript();
  }
  return data;
}

function resetDrawerControls() {
  // Hidden until we know the session actually exists -- otherwise these
  // could retain a stale href/visible state left over from whatever was
  // open previously (OpenClaw's review, point 5).
  document.getElementById("transcriptLoadMore").style.display = "none";
  document.getElementById("transcriptLoadEarlier").style.display = "none";
  document.getElementById("transcriptExportJson").style.display = "none";
  document.getElementById("transcriptExportMd").style.display = "none";
}

// drawerOpen tracks whether the drawer is visible at all -- separate from
// viewingSessionId, which is null both when the drawer is closed AND when
// it's showing the "invalid session id" error state. Using viewingSessionId
// alone for the Escape-key guard meant Escape couldn't close an invalid-id
// drawer (OpenClaw's review pass 2, point 2).
let drawerOpen = false;
// Element to return keyboard focus to on close (the history row that was
// activated, typically) -- null for a fresh deep link, where there's
// nothing meaningful to restore focus to (OpenClaw's review pass 2, point 4).
let drawerOpenerEl = null;

// General recoverable-error drawer state for any malformed/inconsistent
// deep link -- distinct title/text per case, not one generic "Invalid
// session" message reused for every failure mode (OpenClaw's review,
// tranche 3 served-UI pass, point 6: a bad ?message= value showed the same
// "not a valid session id" text as a bad ?session=).
function showDeepLinkError(title, text, originEl = null) {
  viewingSessionId = null;
  drawerOpen = true;
  drawerOpenerEl = originEl;
  document.getElementById("drawerBackdrop").style.display = "";
  document.getElementById("transcriptDrawer").style.display = "flex";
  document.getElementById("transcriptTitle").textContent = title;
  document.getElementById("transcriptMeta").textContent = "";
  document.getElementById("transcriptBody").innerHTML = `<div class="drawer-error">${esc(text)}</div>`;
  resetDrawerControls();
  document.getElementById("transcriptClose").focus();
}

async function openTranscript(sessionId, push = true, originEl = null, targetMessageId = null) {
  viewingSessionId = sessionId;
  viewingSessionMeta = null;
  viewingMessages = new Map();
  viewingNextAfterId = 0;
  viewingHasMore = false;
  viewingTargetMessageId = targetMessageId;
  viewingEarliestLoadedId = null;
  viewingHasMoreBefore = false;
  viewingBacklogComplete = false;
  pendingLiveMessages = [];
  drawerOpen = true;
  drawerOpenerEl = originEl;

  document.getElementById("drawerBackdrop").style.display = "";
  document.getElementById("transcriptDrawer").style.display = "flex";
  document.getElementById("transcriptTitle").textContent = `Session #${sessionId}`;
  document.getElementById("transcriptMeta").textContent = "";
  document.getElementById("transcriptBody").innerHTML = `<div class="empty">Loading&hellip;</div>`;
  resetDrawerControls();
  document.getElementById("transcriptClose").focus();

  // Opening pushes a NEW history entry marked `pushed: true`; closing goes
  // back to whatever preceded it (see closeTranscript) rather than pushing a
  // further "closed" entry forward -- otherwise Back from the closed state
  // revisits the stale ?session=N entry and reopens it (review pass 1,
  // point 2). The `pushed` marker itself is what lets closeTranscript tell a
  // state WE pushed apart from the page's own base/initial entry (review
  // pass 2, point 1) -- back() is only safe on the former; a direct deep
  // link's initial entry has nothing "before" it in this tab worth leaving
  // the app for.
  if (push) {
    const url = targetMessageId ? `?session=${sessionId}&message=${targetMessageId}` : `?session=${sessionId}`;
    history.pushState({ session: sessionId, message: targetMessageId, pushed: true }, "", url);
  }

  try {
    await fetchSessionMeta(sessionId);
  } catch {
    // Recoverable error state, not a crash -- covers both an unknown session
    // id typed/linked directly and a transient fetch failure.
    if (viewingSessionId === sessionId) {
      document.getElementById("transcriptBody").innerHTML =
        `<div class="drawer-error">Session #${sessionId} not found or couldn't be loaded.</div>`;
    }
    return;
  }
  if (viewingSessionId !== sessionId) return; // moved on while the meta fetch was in flight

  // Only reveal export links once we've confirmed the session exists.
  document.getElementById("transcriptExportJson").href = `/api/chat/sessions/${sessionId}/export?format=json`;
  document.getElementById("transcriptExportJson").style.display = "";
  document.getElementById("transcriptExportMd").href = `/api/chat/sessions/${sessionId}/export?format=markdown`;
  document.getElementById("transcriptExportMd").style.display = "";

  if (targetMessageId) await loadTranscriptAround(sessionId, targetMessageId);
  else await loadMoreTranscript();
}

// Jump straight to a specific message (a search hit) without paging from
// message 1 -- uses the bounded around-message window, then scrolls to and
// highlights the target. A malformed/mismatched message id (wrong session,
// nonexistent) surfaces as a recoverable error, same pattern as an invalid
// session id, and stays inside CollabHub (tranche 3, per OpenClaw's review).
async function loadTranscriptAround(sessionId, messageId) {
  let data;
  try {
    const res = await fetch(
      `/api/chat/sessions/${sessionId}/messages/around?message_id=${messageId}&before=25&after=25`,
      { cache: "no-store" },
    );
    if (!res.ok) throw new Error("fetch failed: " + res.status);
    data = await res.json();
  } catch {
    if (viewingSessionId === sessionId) {
      document.getElementById("transcriptBody").innerHTML =
        `<div class="drawer-error">Message #${messageId} not found in session #${sessionId}.</div>`;
    }
    return;
  }
  if (viewingSessionId !== sessionId) return;
  viewingMessages = new Map(data.messages.map(m => [m.id, m]));
  viewingEarliestLoadedId = data.earliest_loaded_id;
  viewingNextAfterId = data.latest_loaded_id || 0; // forward "Load more" continues from here, not from 0
  viewingHasMoreBefore = data.has_more_before;
  viewingHasMore = data.has_more_after;
  viewingBacklogComplete = !data.has_more_after; // nothing newer left to load -- safe to live-tail directly
  renderTranscript();
  document.getElementById("transcriptLoadEarlier").style.display = viewingHasMoreBefore ? "" : "none";
  document.getElementById("transcriptLoadMore").style.display = viewingHasMore ? "" : "none";
  requestAnimationFrame(() => {
    const el = document.querySelector(`#transcriptBody [data-message-id="${messageId}"]`);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("highlight-flash"); }
  });
}

async function loadEarlierTranscript() {
  if (viewingSessionId == null || viewingEarliestLoadedId == null) return;
  const sessionId = viewingSessionId;
  // Preserve scroll position around the prepend -- without this, adding
  // messages above the current view shifts everything down and the
  // viewport visibly jumps (OpenClaw's review, secondary UX point). Anchor
  // on the message that WAS earliest-loaded: it stays in the DOM after
  // prepending, just no longer at the very top, so its position delta
  // before/after tells us exactly how far to adjust scrollTop.
  const anchorId = viewingEarliestLoadedId;
  const body = document.getElementById("transcriptBody");
  const anchorElBefore = body.querySelector(`[data-message-id="${anchorId}"]`);
  const offsetBefore = anchorElBefore ? anchorElBefore.getBoundingClientRect().top : null;

  let data;
  try {
    const res = await fetch(
      `/api/chat/sessions/${sessionId}/messages?before_id=${viewingEarliestLoadedId}&limit=50`,
      { cache: "no-store" },
    );
    if (!res.ok) throw new Error("fetch failed: " + res.status);
    data = await res.json();
  } catch { return; }
  if (viewingSessionId !== sessionId) return;
  for (const m of data.messages) viewingMessages.set(m.id, m);
  viewingHasMoreBefore = data.has_more;
  viewingEarliestLoadedId = data.messages.length ? data.messages[0].id : viewingEarliestLoadedId;
  document.getElementById("transcriptLoadEarlier").style.display = viewingHasMoreBefore ? "" : "none";
  renderTranscript();

  if (offsetBefore != null) {
    const anchorElAfter = body.querySelector(`[data-message-id="${anchorId}"]`);
    if (anchorElAfter) {
      const offsetAfter = anchorElAfter.getBoundingClientRect().top;
      body.scrollTop += (offsetAfter - offsetBefore);
    }
  }
}

async function loadMoreTranscript() {
  if (viewingSessionId == null) return;
  const sessionId = viewingSessionId;
  let data;
  try {
    const res = await fetch(
      `/api/chat/sessions/${sessionId}/messages?after_id=${viewingNextAfterId || 0}&limit=50`,
      { cache: "no-store" },
    );
    if (!res.ok) throw new Error("fetch failed: " + res.status);
    data = await res.json();
  } catch {
    if (viewingSessionId === sessionId && viewingMessages.size === 0) {
      document.getElementById("transcriptBody").innerHTML = `<div class="drawer-error">Could not load transcript.</div>`;
    }
    return;
  }
  if (viewingSessionId !== sessionId) return; // drawer moved on to a different session while this was in flight
  for (const m of data.messages) viewingMessages.set(m.id, m); // id-keyed -- exact ordering, no duplicates across pages
  viewingHasMore = data.has_more;
  viewingNextAfterId = data.next_after_id != null ? data.next_after_id : viewingNextAfterId;
  if (!viewingHasMore) {
    // Backlog is now fully loaded -- safe to flush anything that arrived
    // live while we were still paging through history (no more hidden-gap
    // risk once every id up to "now" is accounted for).
    viewingBacklogComplete = true;
    if (pendingLiveMessages.length) {
      for (const m of pendingLiveMessages) viewingMessages.set(m.id, m);
      pendingLiveMessages = [];
    }
  }
  renderTranscript();
  document.getElementById("transcriptLoadMore").style.display = viewingHasMore ? "" : "none";
}

function renderTranscript() {
  if (viewingSessionId == null) return;
  const meta = viewingSessionMeta;
  if (meta) {
    document.getElementById("transcriptTitle").textContent = `Session #${meta.id}`;
    document.getElementById("transcriptMeta").innerHTML =
      `${esc(meta.status)} &middot; started by ${esc(meta.started_by || "?")} &middot; ${fmtTime(meta.started_at)}` +
      (meta.ended_at ? ` &middot; ended ${fmtTime(meta.ended_at)} (${fmtDuration(meta.duration_seconds)})` : " &middot; ongoing") +
      (meta.linked_tasks && meta.linked_tasks.length ? `<br>${linkChips(meta.linked_tasks)}` : "");
  }
  const msgs = [...viewingMessages.values()].sort((a, b) => a.id - b.id);
  const body = document.getElementById("transcriptBody");
  body.innerHTML = msgs.length
    ? msgs.map(m => `
        <div class="msg ${esc(m.author)}" data-message-id="${m.id}">
          <div class="head"><b>${esc(m.author || "?")}</b> &middot; <time>${fmtTime(m.created_at)}</time></div>
          <div class="bubble">${esc(m.text)}</div>
        </div>`).join("")
    : `<div class="empty">no messages</div>`;
  if (pendingLiveMessages.length) {
    body.innerHTML += `<div class="empty">${pendingLiveMessages.length} new message(s) arrived -- click "Load more" to reach them</div>`;
  }
}

// User-initiated close (button/Escape/backdrop): if the CURRENT history
// entry is one WE pushed (state.pushed === true), go back to whatever
// preceded it -- pushing a further "closed" entry forward instead left a
// stale ?session=N entry ahead of the current position that a subsequent
// Back would revisit and reopen (review pass 1, point 2, exact repro: open,
// close, Back reopens). But if the current entry is the page's own base/
// initial entry (a direct deep link, never pushed by us -- state.pushed is
// false or the state predates our marker), back() would leave CollabHub
// entirely; replaceState in place instead (review pass 2, point 1).
function closeTranscript(viaHistory = false) {
  viewingSessionId = null;
  viewingSessionMeta = null;
  viewingMessages = new Map();
  viewingBacklogComplete = false;
  pendingLiveMessages = [];
  drawerOpen = false;
  document.getElementById("drawerBackdrop").style.display = "none";
  document.getElementById("transcriptDrawer").style.display = "none";
  if (drawerOpenerEl) { try { drawerOpenerEl.focus(); } catch { /* element may be gone */ } }
  drawerOpenerEl = null;
  if (!viaHistory) {
    const cur = history.state;
    if (cur && cur.pushed) history.back();
    else history.replaceState({ session: null, pushed: false }, "", location.pathname);
  }
}

// ---------------------------------------------------------------------------
// Search (tranche 3)
// ---------------------------------------------------------------------------
let searchOpen = false;
let searchQuery = "";
let searchOffset = 0;
let searchHasMore = false;
let searchResults = [];
let searchOpenerEl = null;
// Monotonic generation counter, not a `searchQuery !== q` string compare --
// the string compare fails to detect staleness when the SAME query is
// submitted twice in quick succession (the second response would still
// match `searchQuery === q` even after a third, newer request superseded
// it). Every request captures the generation at its start; a response is
// only applied if that generation is still current when it returns
// (OpenClaw's review, tranche 3 served-UI pass, point 2).
let searchGeneration = 0;
// Single-flight guard for "Load more" specifically -- double-clicking it
// launched two requests at the same offset; de-dupe hid the duplicate rows
// but offset still advanced twice, silently skipping a page (point 1).
let searchLoadMoreInFlight = false;

function closeSearch(viaHistory = false) {
  searchOpen = false;
  document.getElementById("searchBackdrop").style.display = "none";
  document.getElementById("searchDrawer").style.display = "none";
  if (searchOpenerEl) { try { searchOpenerEl.focus(); } catch { /* element may be gone */ } }
  searchOpenerEl = null;
}

// Sentinel-based highlighting -- escape the WHOLE snippet first (any real
// HTML in the indexed content, e.g. a stored <script>, becomes inert text),
// THEN swap the sentinel control characters (which survive HTML-escaping
// unchanged, since esc() only touches &<>") for real <mark> tags. Only our
// own insertions ever become markup; anything user-supplied is always
// escaped first (OpenClaw's review, tranche 3 -- never trust snippet()
// output as HTML).
function renderSnippet(raw) {
  return esc(raw).replaceAll("\x01", "<mark>").replaceAll("\x02", "</mark>");
}

async function runSearchQuery(q, offset = 0) {
  const params = new URLSearchParams({ q, limit: 20, offset });
  const res = await fetch(`/api/search?${params}`, { cache: "no-store" });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ("search failed: " + res.status));
  }
  return res.json();
}

async function doSearch(q, originEl = null) {
  q = (q || "").trim();
  if (!q) return;
  const gen = ++searchGeneration; // this request now owns "current"; any older one is stale on arrival
  searchQuery = q;
  searchOffset = 0;
  searchResults = [];
  searchOpen = true;
  searchOpenerEl = originEl;
  document.getElementById("searchBackdrop").style.display = "";
  document.getElementById("searchDrawer").style.display = "flex";
  document.getElementById("searchTitle").textContent = `Search: "${q}"`;
  document.getElementById("searchMeta").textContent = "";
  document.getElementById("searchBody").innerHTML = `<div class="empty">Searching&hellip;</div>`;
  document.getElementById("searchLoadMore").style.display = "none";
  document.getElementById("searchClose").focus();

  try {
    const data = await runSearchQuery(q, 0);
    if (gen !== searchGeneration) return; // superseded by a newer search while this was in flight
    searchResults = data.results;
    searchHasMore = data.has_more;
    searchOffset = data.results.length;
    renderSearchResults();
  } catch (err) {
    if (gen === searchGeneration) {
      document.getElementById("searchBody").innerHTML = `<div class="drawer-error">${esc(err.message || "Search failed.")}</div>`;
    }
  }
}

async function loadMoreSearch() {
  if (!searchHasMore || searchLoadMoreInFlight) return;
  searchLoadMoreInFlight = true;
  const gen = searchGeneration; // this page belongs to the CURRENT search; a fresh doSearch() call invalidates it
  const btn = document.getElementById("searchLoadMore");
  btn.disabled = true;
  try {
    const data = await runSearchQuery(searchQuery, searchOffset);
    if (gen !== searchGeneration) return; // the user started a new search while this page was loading
    // De-dupe defensively by (source_type, source_id) -- the corpus can
    // mutate between page fetches, e.g. a new comment landing between
    // "load more" clicks (OpenClaw's review).
    const seen = new Set(searchResults.map(r => r.source_type + ":" + r.source_id));
    for (const r of data.results) {
      const key = r.source_type + ":" + r.source_id;
      if (!seen.has(key)) { searchResults.push(r); seen.add(key); }
    }
    searchHasMore = data.has_more;
    searchOffset += data.results.length;
    renderSearchResults();
  } catch {
    if (gen === searchGeneration) {
      const body = document.getElementById("searchBody");
      const err = document.createElement("div");
      err.className = "drawer-error";
      err.innerHTML = `Could not load more results. <button type="button" id="searchRetryLoadMore">Retry</button>`;
      body.appendChild(err);
      document.getElementById("searchRetryLoadMore").addEventListener("click", () => { err.remove(); loadMoreSearch(); });
    }
  } finally {
    searchLoadMoreInFlight = false;
    btn.disabled = false;
  }
}

function searchResultLabel(r) {
  switch (r.source_type) {
    case "task": return `Task #${r.source_id}`;
    case "comment": return `Comment on #${r.context.task_id ?? "?"}${r.context.task_title ? ": " + r.context.task_title : ""}`;
    case "note": return "Note";
    case "chat_message": return `Chat session #${r.context.session_id ?? "?"}`;
    default: return r.source_type;
  }
}

function renderSearchResults() {
  const el = document.getElementById("searchBody");
  document.getElementById("searchMeta").textContent = searchResults.length
    ? `${searchResults.length}${searchHasMore ? "+" : ""} result(s)` : "";
  el.innerHTML = searchResults.length
    ? searchResults.map((r, i) => `
        <div class="search-result" data-index="${i}" role="button" tabindex="0"
             aria-label="Open ${esc(searchResultLabel(r))}">
          <div class="srhead"><span class="srtype">${esc(r.source_type.replace("_", " "))}</span>
            <span>${esc(searchResultLabel(r))}</span>
            <span>&middot; ${esc(r.author || "?")}</span>
            <span>&middot; <time>${fmtTime(r.created_at)}</time></span>
          </div>
          <div class="srsnippet">${renderSnippet(r.snippet)}</div>
        </div>`).join("")
    : `<div class="empty">no results</div>`;
  for (const row of el.querySelectorAll(".search-result")) {
    const idx = parseInt(row.dataset.index, 10);
    const open = () => openSearchResult(searchResults[idx], row);
    row.addEventListener("click", open);
    row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  }
  document.getElementById("searchLoadMore").style.display = searchHasMore ? "" : "none";
}

async function openSearchResult(r, originEl) {
  // Always close search before navigating to the destination -- the two
  // overlay drawers are never meant to stack (see the Escape/Tab handlers
  // below, which assume only one is ever open at a time).
  closeSearch(true);
  if (r.source_type === "chat_message") {
    // NOT originEl -- that's the search-result row, which just got hidden
    // by closeSearch() above. Focusing a hidden element on transcript close
    // would leave keyboard focus stuck somewhere invisible. The search
    // input is the closest VISIBLE, still-meaningful place to return focus
    // to (OpenClaw's review, tranche 3 served-UI pass, point 3).
    await openTranscript(r.context.session_id, true, document.getElementById("searchInput"), r.source_id);
  } else if (r.source_type === "task") {
    await scrollAndHighlightTask(r.source_id, null);
  } else if (r.source_type === "comment") {
    await scrollAndHighlightTask(r.context.task_id, r.source_id);
  } else if (r.source_type === "note") {
    await scrollAndHighlightNote(r.source_id);
  }
}

// matchedCommentId, if given, renders a callout identifying that SPECIFIC
// comment (author + full text) on the highlighted card -- task cards don't
// render their comments at all normally, so without this a comment search
// hit would just highlight the parent task with no way to tell which of
// its comments actually matched (OpenClaw's review, point 4).
async function scrollAndHighlightTask(taskId, matchedCommentId) {
  if (taskId == null) return;
  let matchedComment = null;
  if (!tasksById.has(taskId) || matchedCommentId != null) {
    const t = await fetchTask(taskId);
    if (t) {
      tasksById.set(t.id, t);
      renderBoard();
      if (matchedCommentId != null) matchedComment = (t.comments || []).find(c => c.id === matchedCommentId) || null;
    }
  }
  // A search/deep-link destination must never land inside a collapsed
  // column -- expand it (and persist that) before the scroll below, since a
  // display:none ancestor has no layout box to scroll into view at all
  // (OpenClaw's review).
  const destTask = tasksById.get(taskId);
  if (destTask) ensureSectionExpanded(`column:${destTask.status}`);
  requestAnimationFrame(() => {
    const el = document.querySelector(`#board .card[data-task-id="${taskId}"]`);
    if (!el) return;
    el.scrollIntoView({ block: "center" });
    el.classList.add("highlight-flash");
    const oldCallout = el.querySelector(".comment-callout");
    if (oldCallout) oldCallout.remove();
    if (matchedComment) {
      const callout = document.createElement("div");
      callout.className = "comment-callout";
      callout.innerHTML = `<b>Matched comment</b> by ${esc(matchedComment.author || "?")}: ${esc(matchedComment.text)}`;
      el.appendChild(callout);
    }
  });
}

async function scrollAndHighlightNote(noteId) {
  ensureSectionExpanded("panel:notes");
  if (!notesById.has(noteId)) {
    // Exact-id fetch -- list_notes only returns the newest slice, so an
    // older indexed note needs its own lookup, not a generous-limit guess
    // that still has a ceiling (OpenClaw's review, point 5).
    try {
      const res = await fetch(`/api/notes/${noteId}`, { cache: "no-store" });
      if (res.ok) {
        const note = await res.json();
        notesById.set(note.id, note);
        renderNotes();
      }
    } catch { /* best effort -- note just won't be found below if this fails */ }
  }
  requestAnimationFrame(() => {
    const el = document.querySelector(`#notes .note[data-note-id="${noteId}"]`);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("highlight-flash"); }
  });
}

document.getElementById("historyLoadMore").addEventListener("click", loadMoreHistory);
document.getElementById("transcriptLoadMore").addEventListener("click", loadMoreTranscript);
document.getElementById("transcriptLoadEarlier").addEventListener("click", loadEarlierTranscript);
document.getElementById("transcriptClose").addEventListener("click", () => closeTranscript(false));
document.getElementById("drawerBackdrop").addEventListener("click", () => closeTranscript(false));

// Escape/Tab cover BOTH overlay drawers (transcript + search). Only one is
// ever open at a time by construction (opening a search result always
// closes the search panel first -- see openSearchResult), so there's no
// real stacking-order ambiguity to resolve; check search first regardless.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (searchOpen) closeSearch(false);
  else if (drawerOpen) closeTranscript(false);
});

// Minimal focus trap while a drawer is open -- Tab/Shift+Tab cycles through
// that drawer's own focusable controls instead of escaping to the page
// behind it (review pass 2, point 4: "part of best product, not cosmetic").
document.addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const activeDrawer = searchOpen ? document.getElementById("searchDrawer")
    : drawerOpen ? document.getElementById("transcriptDrawer") : null;
  if (!activeDrawer) return;
  const focusables = Array.from(
    activeDrawer.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')
  ).filter(el => el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

document.getElementById("searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  doSearch(document.getElementById("searchInput").value, document.getElementById("searchInput"));
});
document.getElementById("searchClose").addEventListener("click", () => closeSearch(false));
document.getElementById("searchBackdrop").addEventListener("click", () => closeSearch(false));
document.getElementById("searchLoadMore").addEventListener("click", loadMoreSearch);

// Deep link: ?session=N[&message=M] opens on load. Browser back/forward
// already changed the URL by the time popstate fires, so this only REACTS
// to it (viaHistory = true everywhere here) -- pushing/calling
// history.back() again in response to a popstate would fight the
// navigation that just happened.
window.addEventListener("popstate", () => {
  const params = new URLSearchParams(location.search);
  const sid = params.get("session");
  const mid = params.get("message");
  if (sid == null) {
    // A stray ?message=M with no ?session=N is an inconsistent link, not
    // silently ignorable -- normalizing it away would hide a broken deep
    // link instead of surfacing it (OpenClaw's review, point 6).
    if (mid != null) showDeepLinkError("Invalid link", "A message link requires a session id.");
    else closeTranscript(true);
    return;
  }
  if (!SESSION_ID_RE.test(sid)) { showDeepLinkError("Invalid session", `"${sid}" is not a valid session id.`); return; }
  if (mid != null && !MESSAGE_ID_RE.test(mid)) { showDeepLinkError("Invalid message", `"${mid}" is not a valid message id.`); return; }
  openTranscript(parseInt(sid, 10), false, null, mid != null ? parseInt(mid, 10) : null);
});

// Apply persisted collapse state to the four static sidebar panels before
// any board event has a chance to render -- board columns get this for free
// inside renderBoard() itself, but the static panels' toggle buttons/aria
// need it set once up front too.
applyAllCollapseState();
connectSSE();
fetchPresence();
setInterval(fetchPresence, 15000);
setInterval(renderPresence, 5000);
refreshHistoryList();
{
  const params = new URLSearchParams(location.search);
  const deepLinkSession = params.get("session");
  const deepLinkMessage = params.get("message");
  // Claim this page's very first history entry as our own base state,
  // marked `pushed: false` -- closeTranscript uses that marker to tell "a
  // state we pushed" (safe to history.back() from) apart from "the entry
  // this tab started on" (must replaceState, not back(), or a direct deep
  // link's Close/Escape would navigate the user out of CollabHub entirely --
  // review pass 2, point 1).
  history.replaceState({ session: deepLinkSession, pushed: false }, "", location.href);
  if (deepLinkSession == null) {
    if (deepLinkMessage != null) showDeepLinkError("Invalid link", "A message link requires a session id.");
  } else if (!SESSION_ID_RE.test(deepLinkSession)) {
    showDeepLinkError("Invalid session", `"${deepLinkSession}" is not a valid session id.`);
  } else if (deepLinkMessage != null && !MESSAGE_ID_RE.test(deepLinkMessage)) {
    showDeepLinkError("Invalid message", `"${deepLinkMessage}" is not a valid message id.`);
  } else {
    openTranscript(parseInt(deepLinkSession, 10), false, null, deepLinkMessage != null ? parseInt(deepLinkMessage, 10) : null);
  }
}
