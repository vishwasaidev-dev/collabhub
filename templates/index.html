<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CollabHub</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea; --text: #1b1f27;
    --muted: #6b7280; --accent: #6d5efc;
    --open: #64748b; --claimed: #d97706; --in_progress: #2563eb;
    --blocked: #dc2626; --done: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --panel: #1c1f28; --border: #2a2e3a; --text: #e7e9ee;
      --muted: #8b92a3; --accent: #9b8bff;
      --open: #8b95a8; --claimed: #f2a93b; --in_progress: #5b9bff;
      --blocked: #ff6b6b; --done: #3ecf6e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Inter, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .briefing-link {
    font-size: 11.5px; color: var(--muted); text-decoration: none; border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  }
  .briefing-link:hover, .briefing-link:focus-visible { color: var(--text); border-color: var(--accent); }
  .conn-status {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
  }
  .conn-status .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 25%, transparent);
  }
  .conn-status.live { color: var(--done); }
  .conn-status.live .dot { background: var(--done); box-shadow: 0 0 0 3px color-mix(in srgb, var(--done) 25%, transparent); }
  .conn-status.reconnecting { color: var(--claimed); }
  .conn-status.reconnecting .dot { background: var(--claimed); box-shadow: 0 0 0 3px color-mix(in srgb, var(--claimed) 25%, transparent); }
  .conn-status.polling { color: var(--in_progress); }
  .conn-status.polling .dot { background: var(--in_progress); box-shadow: 0 0 0 3px color-mix(in srgb, var(--in_progress) 25%, transparent); }
  .conn-status.offline { color: var(--blocked); }
  .conn-status.offline .dot { background: var(--blocked); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blocked) 25%, transparent); }
  main {
    display: grid; grid-template-columns: 1fr 340px; gap: 20px;
    padding: 20px 24px; align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1200px) { .board { grid-template-columns: repeat(2, 1fr); } }
  .col h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 0 0 10px 2px; display: flex; align-items: center; gap: 6px;
  }
  .col h2 .count {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0 7px; font-size: 11px; color: var(--text);
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  .card .title { font-weight: 600; margin-bottom: 4px; }
  .card .desc { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; white-space: pre-wrap; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    font-weight: 600; color: #fff;
  }
  .badge.open { background: var(--open); }
  .badge.claimed { background: var(--claimed); }
  .badge.in_progress { background: var(--in_progress); }
  .badge.blocked { background: var(--blocked); }
  .badge.done { background: var(--done); }
  .assignee {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent); padding: 1px 8px; border-radius: 999px; font-weight: 600;
  }
  .priority {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    font-weight: 600; color: #fff;
  }
  .priority.low { background: var(--muted); }
  .priority.normal { display: none; } /* the common case -- don't add visual noise for the default */
  .priority.high { background: var(--claimed); }
  .priority.urgent { background: var(--blocked); }
  .due-date { display: inline-flex; align-items: center; gap: 3px; }
  .due-date.overdue { color: var(--blocked); font-weight: 600; }
  .due-date.overdue::before { content: "⚠"; } /* icon, not color alone, marks overdue -- OpenClaw's review */
  .task-complete { margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .task-complete-btn {
    font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--done);
    background: none; color: var(--done); cursor: pointer; font-weight: 600;
  }
  .task-complete-btn[aria-disabled="true"] { opacity: .6; cursor: default; }
  .task-complete-error { font-size: 11px; color: var(--blocked); }
  .task-complete-retry {
    font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--blocked);
    background: none; color: var(--blocked); cursor: pointer; margin-left: 4px;
  }
  .checklist { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .checklist-progress { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .checklist-items { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .checklist-item {
    display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; cursor: pointer;
    padding: 2px 0;
  }
  .checklist-item input[type="checkbox"] { margin-top: 2px; flex: none; }
  .checklist-item input[aria-disabled="true"] { opacity: .5; }
  .checklist-item .item-text { flex: 1; word-break: break-word; }
  .checklist-item .item-text.done { text-decoration: line-through; color: var(--muted); }
  .checklist-item.checklist-error .item-text { color: var(--blocked); }
  .checklist-item .item-delete {
    flex: none; background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 2px; visibility: hidden;
  }
  /* Reveal on :focus-within too, not just :hover. visibility:hidden actually
     REMOVES an element from Tab's sequential focus order -- it was never
     reachable by keyboard at all before this. The fix works because Tab
     first lands on the (always-visible) checkbox, which triggers
     :focus-within on the shared .checklist-item row and reveals the delete
     button just before the NEXT Tab press would need to reach it
     (corrected per OpenClaw's review -- the original comment here wrongly
     claimed visibility:hidden controls stay tabbable). */
  .checklist-item:hover .item-delete, .checklist-item:focus-within .item-delete { visibility: visible; }
  .checklist-item .item-delete:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .checklist-item .item-delete[aria-disabled="true"] { opacity: .5; cursor: default; }
  .item-error-msg { font-size: 11px; color: var(--blocked); flex: none; }
  .item-retry {
    flex: none; font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--blocked);
    background: none; color: var(--blocked); cursor: pointer;
  }
  .checklist-add { display: flex; gap: 4px; margin-top: 6px; }
  .checklist-add input {
    flex: 1; font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  .checklist-add button {
    font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  .checklist-add button[aria-disabled="true"] { opacity: .6; cursor: default; }
  .checklist-add-error { font-size: 11px; color: var(--blocked); margin-top: 4px; }
  .checklist-limit { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .comments { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .comment-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .comment-item { font-size: 12.5px; }
  .comment-item .chead { color: var(--muted); font-size: 11px; margin-bottom: 1px; }
  .comment-item .chead b { color: var(--text); }
  .comment-item .ctext { white-space: pre-wrap; }
  .comment-add { display: flex; gap: 4px; margin-top: 6px; }
  .comment-add input {
    flex: 1; font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  .comment-add button {
    font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  .comment-add button[aria-disabled="true"] { opacity: .6; cursor: default; }
  .comment-add-error { font-size: 11px; color: var(--blocked); margin-top: 4px; }
  .attachments { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .attachment-list { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .attachment-item {
    display: flex; align-items: baseline; gap: 6px; font-size: 12px; flex-wrap: wrap;
    padding: 2px 0;
  }
  .attachment-link {
    color: var(--accent); text-decoration: none; font-weight: 600; word-break: break-all;
  }
  .attachment-link:hover, .attachment-link:focus-visible { text-decoration: underline; }
  .attachment-meta { color: var(--muted); font-size: 11px; }
  .attachment-item .attachment-delete {
    flex: none; background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 2px; visibility: hidden; margin-left: auto;
  }
  /* Same :focus-within reveal pattern as the checklist's delete button --
     Tab reaches the (always-visible) download link first, which reveals
     this button for the next Tab press. */
  .attachment-item:hover .attachment-delete, .attachment-item:focus-within .attachment-delete { visibility: visible; }
  .attachment-item .attachment-delete:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .attachment-item .attachment-delete[aria-disabled="true"] { opacity: .5; cursor: default; }
  .attachment-item.attachment-error .attachment-link { color: var(--blocked); }
  .attachment-add { display: flex; gap: 4px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .attachment-add input[type="file"] { flex: 1; font-size: 11.5px; min-width: 0; color: var(--text); }
  .attachment-add input[aria-disabled="true"] { opacity: .5; }
  .attachment-add button {
    font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; flex: none;
  }
  .attachment-add button[aria-disabled="true"] { opacity: .6; cursor: default; }
  .attachment-uploading { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .attachment-upload-retry {
    font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--blocked);
    background: none; color: var(--blocked); cursor: pointer; margin-left: 4px;
  }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 2px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
  }
  .panel + .panel { margin-top: 20px; }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px;
    display: flex; align-items: center; gap: 6px; cursor: default;
  }
  .panel h2.clickable { cursor: pointer; }
  /* Collapsible sections (board columns + sidebar panels): the toggle is a
     real <button>, not a clickable div -- Enter/Space/click all work for
     free via native button semantics, no manual role/tabindex/keydown
     handling needed (OpenClaw's review). Each toggle's aria-controls points
     at a real, dedicated content element (not an ancestor that also
     contains the button itself); collapsing sets the `hidden` attribute
     directly on THAT element, so the accessibility relationship is accurate
     and the browser's own default [hidden]{display:none} does the hiding --
     header text, "N new" badges, and column counts live in the h2, outside
     the hidden element, and stay visible + keep updating from live events
     while collapsed. */
  .collapse-toggle {
    margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 2px 5px; line-height: 1; border-radius: 4px; flex: none;
  }
  .collapse-toggle:hover { background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); }
  .collapse-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* The browser's own [hidden]{display:none} is a USER-AGENT default, which
     author styles always beat regardless of selector specificity -- so an
     element that also carries its own explicit `display` rule (e.g.
     .chat-log's `display:flex`) silently ignores the hidden attribute
     entirely. Caught live via Playwright (#chatLog stayed visually visible
     while `hidden` and aria-expanded=false both correctly said otherwise) --
     this !important makes `hidden` win unconditionally for every current and
     future collapsible content target, not just the one that happened to
     collide today. */
  [hidden] { display: none !important; }
  .newcount {
    background: var(--accent); color: #fff; border-radius: 999px;
    padding: 0 7px; font-size: 10.5px; font-weight: 700;
  }
  .note { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .note:last-child { border-bottom: none; }
  .note .head { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .note .head b { color: var(--text); }
  .note .text { font-size: 13px; white-space: pre-wrap; }
  time { font-variant-numeric: tabular-nums; }
  .presence-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.5px; }
  .presence-row:not(:last-child) { border-bottom: 1px solid var(--border); }
  .presence-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .presence-dot.online { background: var(--done); box-shadow: 0 0 0 2px color-mix(in srgb, var(--done) 25%, transparent); }
  .presence-dot.offline { background: var(--muted); }
  .presence-row b { flex: none; }
  .presence-row .last { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .chat-panel h2 { display: flex; align-items: center; gap: 8px; }
  .chat-status {
    font-size: 10.5px; font-weight: 600; text-transform: none; letter-spacing: 0;
    padding: 1px 8px; border-radius: 999px; color: #fff;
  }
  .chat-status.active { background: var(--done); }
  .chat-status.ended { background: var(--muted); }
  .chat-log { max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 90%; }
  .msg .head { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .msg .head b { color: var(--accent); }
  .msg .bubble {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 6px 10px; font-size: 13px; white-space: pre-wrap;
  }
  .msg.claude .head b { color: var(--accent); }
  .msg.openclaw .head b { color: var(--claimed); }
  .msg.openclaw .bubble { border-color: color-mix(in srgb, var(--claimed) 40%, var(--border)); }

  /* --- human-facing composers: add task / post note / send chat --------
     All three POST to REST endpoints the two agents already use (no new
     backend surface), so styling/behavior mirrors the checklist/attachment
     forms above: aria-disabled (not disabled) while a submit is in flight,
     inline error text instead of alert(), never silently swallow a
     network failure. */
  .author-field { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .author-field input {
    padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 12.5px; width: 120px;
  }
  .board-header-row { display: flex; align-items: center; gap: 8px; margin: 0 0 10px 2px; }
  .add-toggle {
    font-size: 11px; font-weight: 600; color: var(--accent); background: none;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; cursor: pointer;
  }
  .add-toggle:hover, .add-toggle:focus-visible { border-color: var(--accent); }
  .task-composer { margin-bottom: 14px; }
  .composer-form { display: flex; flex-direction: column; gap: 8px; }
  .composer-form input[type="text"], .composer-form textarea, .composer-form select, .composer-form input[type="date"] {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .composer-form textarea { resize: vertical; min-height: 50px; }
  .composer-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .composer-form button[type="submit"] {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .composer-form button[type="submit"]:hover { opacity: .9; }
  .composer-form button[aria-disabled="true"] { opacity: .6; cursor: default; }
  .composer-error { color: var(--blocked); font-size: 12px; }
  .chat-compose { display: flex; gap: 6px; margin-top: 8px; }
  .chat-compose input {
    flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  .chat-compose input[aria-disabled="true"] { opacity: .6; }
  .chat-compose button {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .chat-compose button[aria-disabled="true"] { opacity: .6; cursor: default; }

  .history-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 8px;
    font-size: 12.5px; cursor: pointer; border: 1px solid transparent;
  }
  .history-row:hover { background: var(--bg); border-color: var(--border); }
  .history-row:not(:last-child) { margin-bottom: 2px; }
  .history-row .hid { color: var(--muted); flex: none; width: 28px; }
  .history-row .htitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-row .hmeta { color: var(--muted); font-size: 11px; flex: none; }
  .loadmore {
    display: block; width: 100%; margin-top: 8px; padding: 6px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 12px; cursor: pointer;
  }
  .loadmore:hover { background: var(--bg); }
  .link-chip {
    display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
    margin-right: 4px;
  }

  .search-form {
    display: flex; gap: 6px; margin-left: 16px; flex: 1; max-width: 360px;
  }
  .search-form input {
    flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  .search-form button {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer;
  }
  .search-form button:hover { background: var(--bg); }
  .search-result {
    padding: 10px 6px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
    margin-bottom: 4px;
  }
  .search-result:hover, .search-result:focus { background: var(--bg); border-color: var(--border); }
  .search-result .srhead { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .search-result .srtype {
    text-transform: uppercase; letter-spacing: .03em; font-weight: 700; font-size: 10px;
    padding: 1px 6px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
  }
  .search-result .srsnippet { font-size: 13px; }
  .search-result .srsnippet mark { background: color-mix(in srgb, var(--claimed) 35%, transparent); color: inherit; border-radius: 2px; }
  .highlight-flash { animation: flash-highlight 2s ease-out; }
  .comment-callout {
    margin-top: 8px; padding: 6px 8px; border-radius: 8px; font-size: 12px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  }
  @keyframes flash-highlight {
    0% { background: color-mix(in srgb, var(--accent) 30%, transparent); }
    100% { background: transparent; }
  }

  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
    background: var(--panel); border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(0,0,0,.15); z-index: 21;
    display: flex; flex-direction: column;
  }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .drawer-head h2 { font-size: 15px; margin: 0; }
  .drawer-actions { display: flex; align-items: center; gap: 10px; }
  .drawer-link { font-size: 12px; color: var(--accent); text-decoration: none; }
  .drawer-link:hover { text-decoration: underline; }
  .drawer-close {
    background: none; border: none; font-size: 20px; line-height: 1; color: var(--muted);
    cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  .drawer-close:hover { background: var(--bg); color: var(--text); }
  .drawer-meta {
    padding: 8px 16px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--border);
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .drawer-error { color: var(--blocked); font-size: 13px; padding: 12px 2px; }
</style>
</head>
<body>
<header>
  <h1>CollabHub</h1>
  <span class="sub">shared task board + notes &mdash; Claude &amp; OpenClaw</span>
  <span class="author-field">
    <label for="authorNameInput">Your name</label>
    <input type="text" id="authorNameInput" maxlength="60" placeholder="e.g. vishwas" autocomplete="off">
  </span>
  <form id="searchForm" class="search-form" role="search">
    <input type="search" id="searchInput" placeholder="Search tasks, notes, chat&hellip;" aria-label="Search">
    <button type="submit">Search</button>
  </form>
  <span class="conn-status" id="connStatus"><span class="dot"></span><span id="connLabel">Connecting&hellip;</span></span>
  <a class="briefing-link" href="/AGENT_BRIEFING.md" target="_blank" rel="noopener">Agent briefing</a>
</header>
<div class="drawer-backdrop" id="searchBackdrop" style="display:none;"></div>
<div class="drawer search-drawer" id="searchDrawer" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
  <div class="drawer-head">
    <h2 id="searchTitle">Search results</h2>
    <div class="drawer-actions">
      <button id="searchClose" class="drawer-close" aria-label="Close search results" tabindex="0">&times;</button>
    </div>
  </div>
  <div class="drawer-meta" id="searchMeta"></div>
  <div class="drawer-body" id="searchBody"></div>
  <button class="loadmore" id="searchLoadMore" style="display:none;">Load more results</button>
</div>
<main>
  <div>
    <div class="board-header-row">
      <h2 class="clickable" id="boardHeader" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0;display:flex;align-items:center;gap:6px;">Task board <span class="newcount" id="tasksNew" style="display:none;"></span></h2>
      <button type="button" id="addTaskToggle" class="add-toggle" aria-expanded="false" aria-controls="taskComposer">+ Add task</button>
    </div>
    <div class="panel task-composer" id="taskComposer" hidden>
      <form id="newTaskForm" class="composer-form">
        <input type="text" id="newTaskTitle" placeholder="Task title" maxlength="200" aria-label="Task title" autocomplete="off">
        <textarea id="newTaskDesc" placeholder="Description (optional)" maxlength="4000" aria-label="Task description"></textarea>
        <div class="composer-row">
          <select id="newTaskPriority" aria-label="Priority">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
          <input type="date" id="newTaskDue" aria-label="Due date (optional)">
          <button type="submit">Add task</button>
        </div>
        <div class="composer-error" id="newTaskError" role="alert" style="display:none;"></div>
      </form>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div>
    <div class="panel" id="presencePanel">
      <h2>Presence
        <button type="button" class="collapse-toggle" data-section-id="panel:presence" data-section-label="Presence"
                aria-controls="presence" aria-expanded="true" aria-label="Collapse Presence">&#9662;</button>
      </h2>
      <div id="presence"></div>
    </div>
    <div class="panel" id="notesPanel">
      <h2 class="clickable" id="notesHeader">Shared notes <span class="newcount" id="notesNew" style="display:none;"></span>
        <button type="button" class="collapse-toggle" data-section-id="panel:notes" data-section-label="Shared notes"
                aria-controls="notes" aria-expanded="true" aria-label="Collapse Shared notes">&#9662;</button>
      </h2>
      <form id="newNoteForm" class="composer-form" style="margin-bottom:10px;">
        <textarea id="newNoteText" placeholder="Post a note&hellip;" maxlength="4000" aria-label="New note text"></textarea>
        <div class="composer-row"><button type="submit">Post</button></div>
        <div class="composer-error" id="newNoteError" role="alert" style="display:none;"></div>
      </form>
      <div id="notes"></div>
    </div>
    <div class="panel chat-panel" id="chatPanel">
      <h2 class="clickable" id="chatHeader">Live chat <span class="chat-status" id="chatStatus" style="display:none;"></span> <span class="newcount" id="chatNew" style="display:none;"></span>
        <button type="button" class="collapse-toggle" data-section-id="panel:chat" data-section-label="Live chat"
                aria-controls="chatLog" aria-expanded="true" aria-label="Collapse Live chat">&#9662;</button>
      </h2>
      <div class="chat-log" id="chatLog"></div>
      <form id="chatComposeForm" class="chat-compose">
        <input type="text" id="chatComposeInput" placeholder="Message&hellip;" maxlength="4000" aria-label="Chat message" autocomplete="off">
        <button type="submit">Send</button>
      </form>
      <div class="composer-error" id="chatComposeError" role="alert" style="display:none;"></div>
    </div>
    <div class="panel" id="historyPanel">
      <h2>Chat history
        <button type="button" class="collapse-toggle" data-section-id="panel:history" data-section-label="Chat history"
                aria-controls="historyBody" aria-expanded="true" aria-label="Collapse Chat history">&#9662;</button>
      </h2>
      <div id="historyBody">
        <div id="historyList"></div>
        <button class="loadmore" id="historyLoadMore" style="display:none;">Load more</button>
      </div>

</main>
<div class="drawer-backdrop" id="drawerBackdrop" style="display:none;"></div>
<div class="drawer" id="transcriptDrawer" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="transcriptTitle">
  <div class="drawer-head">
    <h2 id="transcriptTitle">Session</h2>
    <div class="drawer-actions">
      <a id="transcriptExportJson" class="drawer-link" href="#">Export JSON</a>
      <a id="transcriptExportMd" class="drawer-link" href="#">Export Markdown</a>
      <button id="transcriptClose" class="drawer-close" aria-label="Close transcript" tabindex="0">&times;</button>
    </div>
  </div>
  <div class="drawer-meta" id="transcriptMeta"></div>
  <button class="loadmore" id="transcriptLoadEarlier" style="display:none;">Load earlier</button>
  <div class="drawer-body" id="transcriptBody"></div>
  <button class="loadmore" id="transcriptLoadMore" style="display:none;">Load more</button>
</div>
<script>
const COLUMNS = [
  ["open", "Open"],
  ["claimed", "Claimed"],
  ["in_progress", "In progress"],
  ["blocked", "Blocked"],
];

// ---------------------------------------------------------------------------
// Canonical client-side state. Every task/note/chat-message is kept in a Map
// keyed by its own id, populated from either the initial atomic snapshot
// (/api/state) or a full re-fetch triggered by a live event. Rendering always
// derives from these maps, never patches the DOM from an event payload
// directly -- event payloads are deltas (e.g. task_updated only carries
// status/assignee), so trusting them for rendering would blank out fields
// the payload didn't mention (OpenClaw's review, 2026-08-14).
// ---------------------------------------------------------------------------
let tasksById = new Map();
let notesById = new Map();
let chatMessagesById = new Map();
let presenceByAgent = new Map();
let activeSession = null;   // {id, status, started_by, ...} | null
// Persisted "was the user scrolled to the bottom of the chat log" intent --
// NOT recomputed from the DOM while #chatLog is hidden (collapsed), since a
// hidden element's scroll metrics are meaningless. Lets an expand action
// correctly reveal the newest message when messages arrived while
// collapsed, without disturbing someone who was intentionally scrolled up
// reading older messages (OpenClaw's review).
//
// Updating this ONLY inside renderChat() was still wrong: a manual scroll
// (no render involved at all) left it stale -- scroll to bottom (true) ->
// scroll up to read old messages (nothing re-renders, flag stays true) ->
// collapse -> a message arrives -> expand forces scrollTop back to the
// bottom, discarding the read position (OpenClaw's second catch on this
// same fix). A live "scroll" listener on the always-present #chatLog
// element closes that gap -- scroll events only fire while an element has
// real layout, so there's no hidden-element false-read risk here the way
// there was reading scrollHeight/clientHeight inside renderChat().
let chatAtBottom = true;
let lastAppliedEventId = 0; // dedupe/idempotency gate -- ignore event.id <= this
// True while a gap is open below lastAppliedEventId that a resync hasn't yet
// closed (a task fetch failed AND the recovery resync itself also failed).
// While true, NO event -- not even one whose own fetch would succeed -- may
// advance the cursor; "a reconnect got scheduled" is not "the gap closed"
// (OpenClaw's exact framing, re-review 2026-08-14). Only a successful full
// resync clears it.
let recoveryRequired = false;
let pageLoadCursor = 0;     // event_cursor at initial load, for "N new" badges
let newCounts = { tasks: 0, notes: 0, chat: 0 };
// Checklist items with an in-flight PATCH/DELETE, keyed "taskId:itemId" --
// rendered disabled so a mid-flight renderBoard() (triggered by an unrelated
// event) can't offer a second click on the same request.
let pendingChecklistOps = new Set();
// "taskId:itemId" -> {action:"toggle"|"delete", desiredDone?:bool} for an
// item whose last toggle/delete attempt failed -- renders an inline Retry
// affordance instead of failing silently (OpenClaw's review).
let checklistItemErrors = new Map();
// taskId -> {text, message} for a failed add -- keeps the user's typed text
// visible (never silently lost) and shows why it failed, instead of an
// alert() (OpenClaw's review).
let checklistAddErrors = new Map();
// taskId -> text currently being submitted -- guards against a double-submit
// while the first request hasn't resolved yet, and keeps the submitted text
// visibly in the (disabled) input during the request instead of blanking it
// prematurely.
let checklistAddPending = new Map();
// taskId -> filename currently uploading (busy state for the attachment form).
let attachmentUploadPending = new Map();
// taskId -> {file: File, message: string} for a failed upload -- keeps the
// actual File object in memory (not just its name) so Retry re-attempts the
// same upload without asking the user to re-pick the file (a file input's
// value can never be set programmatically, so this is the only way to
// offer a real retry -- OpenClaw's review).
let attachmentUploadErrors = new Map();
// "taskId:attachmentId" -> true while a delete request is in flight.
let pendingAttachmentDeletes = new Set();
// "taskId:attachmentId" -> error message for a failed delete.
let attachmentDeleteErrors = new Map();
// taskId -> comment text currently being submitted (same pending/error/retain-
// on-failure shape as checklistAddPending/checklistAddErrors above).
let commentAddPending = new Map();
let commentAddErrors = new Map();
// taskId -> true while a "Mark done" request is in flight (same shape as
// pendingAttachmentDeletes above -- disables the button, no optimistic
// status flip, a fresh fetchTask() on success is what actually moves the
// card to the Done column).
let taskCompletePending = new Set();
// taskId -> error message for a failed "Mark done" attempt.
let taskCompleteErrors = new Map();

// --- collapsible sections (board columns + sidebar panels) ----------------
// Persisted as a JSON array of section ids under one localStorage key,
// validated against a fixed allowlist on every load -- a stale id from an
// older version of this allowlist, or foreign data in the same key, is
// silently dropped rather than trusted (OpenClaw's review). "Done" is
// included even though that column only appears once a task is actually
// done, so a collapse preference set before any task reached "done" still
// applies the first time the column shows up.
const COLLAPSE_STORAGE_KEY = "collabhub.collapsed.v1";
const COLLAPSIBLE_ALLOWLIST = new Set([
  "column:open", "column:claimed", "column:in_progress", "column:blocked", "column:done",
  "panel:presence", "panel:notes", "panel:chat", "panel:history",
]);

function loadCollapsedSections() {
  try {
    const raw = localStorage.getItem(COLLAPSE_STORAGE_KEY);
    if (!raw) return new Set();
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return new Set();
    return new Set(parsed.filter(id => COLLAPSIBLE_ALLOWLIST.has(id)));
  } catch {
    // Corrupt JSON, a SecurityError from disabled/private-mode storage, or
    // anything else localStorage/JSON can throw -- fall back to "nothing
    // collapsed" so a bad persisted value can never break the dashboard.
    return new Set();
  }
}
function saveCollapsedSections() {
  try {
    localStorage.setItem(COLLAPSE_STORAGE_KEY, JSON.stringify([...collapsedSections]));
  } catch {
    // Quota exceeded / private mode / disabled storage -- the preference
    // just won't survive a reload; not worth surfacing for a display-only
    // setting.
  }
}
let collapsedSections = loadCollapsedSections();

// Reflects `collapsedSections` onto the DOM for one section id. Each
// toggle's aria-controls names a real, dedicated content element (never an
// ancestor that also contains the button itself); collapsing sets the
// `hidden` attribute directly on THAT element, which is both the correct
// accessibility relationship and gets the browser's own default
// [hidden]{display:none} for free -- no separate CSS rule to keep in sync.
// Works uniformly for the four static sidebar panels AND the
// dynamically-regenerated board columns, since it's a live DOM query, not
// something baked into a render template.
function applySectionCollapse(sectionId) {
  const collapsed = collapsedSections.has(sectionId);
  document.querySelectorAll(`.collapse-toggle[data-section-id="${sectionId}"]`).forEach(btn => {
    const bodyId = btn.getAttribute("aria-controls");
    const body = bodyId ? document.getElementById(bodyId) : null;
    if (body) body.hidden = collapsed;
    btn.setAttribute("aria-expanded", String(!collapsed));
    btn.setAttribute("aria-label", `${collapsed ? "Expand" : "Collapse"} ${btn.dataset.sectionLabel || ""}`.trim());
    btn.innerHTML = collapsed ? "&#9656;" : "&#9662;";
  });
}
function applyAllCollapseState() {
  for (const id of COLLAPSIBLE_ALLOWLIST) applySectionCollapse(id);
}
function toggleSection(sectionId) {
  if (!COLLAPSIBLE_ALLOWLIST.has(sectionId)) return;
  if (collapsedSections.has(sectionId)) collapsedSections.delete(sectionId);
  else collapsedSections.add(sectionId);
  saveCollapsedSections();
  applySectionCollapse(sectionId);
  if (sectionId === "panel:chat" && !collapsedSections.has(sectionId) && chatAtBottom) {
    // Live chat just expanded and the last known intent was "at the
    // bottom" -- #chatLog had no real layout box to scroll while hidden, so
    // this is the first point where setting scrollTop can actually take
    // effect (OpenClaw's review: messages arriving while collapsed must
    // still be revealed on expand).
    const log = document.getElementById("chatLog");
    if (log) log.scrollTop = log.scrollHeight;
  }
}
// Expand a section unconditionally (used by search/deep-link navigation so
// the destination is never left hidden) and persist that expansion so it
// stays visible, not just for this one scroll.
function ensureSectionExpanded(sectionId) {
  if (!collapsedSections.has(sectionId)) return;
  collapsedSections.delete(sectionId);
  saveCollapsedSections();
  applySectionCollapse(sectionId);
}
// One delegated listener handles every collapse toggle, static or
// regenerated. NOTE: this alone does NOT stop the click from also reaching
// notesHeader/chatHeader's own listener -- that listener is bound directly
// to the h2 and fires during the bubble phase BEFORE the event reaches this
// document-level handler, so calling stopPropagation() here is too late
// (OpenClaw caught this: the badge was clearing anyway despite this
// listener's own stopPropagation call). The actual fix is in
// notesHeader/chatHeader's listeners below, which ignore clicks whose
// target is inside .collapse-toggle.
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".collapse-toggle");
  if (!btn) return;
  toggleSection(btn.dataset.sectionId);
});
// Cross-tab sync: the "storage" event fires in OTHER tabs/windows when this
// key changes, never in the tab that made the write.
window.addEventListener("storage", (e) => {
  if (e.key !== COLLAPSE_STORAGE_KEY) return;
  collapsedSections = loadCollapsedSections();
  applyAllCollapseState();
});

function fmtTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch { return iso; }
}
function relTime(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 10) return "just now";
  if (s < 60) return `${s}s ago`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}h ago`;
  return fmtTime(iso);
}
function esc(s) {
  return (s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
// `new Date('YYYY-MM-DD')` parses as UTC midnight, which renders as the
// PREVIOUS calendar day in any negative-UTC-offset timezone -- parse the
// components manually and build via the local constructor instead.
function parseLocalDate(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDueDate(ymd) {
  return parseLocalDate(ymd).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function isOverdue(ymd) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return parseLocalDate(ymd).getTime() < today.getTime();
}
function fmtBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / (1024 * 1024)).toFixed(1)} MB`;
}

// --- rendering (always derived from the Maps above) -------------------------

// Mirrors storage.py's CHECKLIST_MAX_ITEMS_PER_TASK -- surfaced here purely
// to show the limit in the UI once reached; the server remains the actual
// enforcement point (this is a display convenience, not a security boundary).
const CHECKLIST_MAX_ITEMS = 50;

function checklistHtml(t) {
  const items = t.checklist_items || [];
  const progress = t.checklist_progress || { done: 0, total: 0 };
  const itemsHtml = items.map(it => {
    const key = `${t.id}:${it.id}`;
    const busy = pendingChecklistOps.has(key);
    const err = checklistItemErrors.get(key);
    // aria-disabled, not the `disabled` attribute -- a genuinely disabled
    // control cannot receive focus at all, which is exactly what broke this
    // tranche's claimed focus preservation (renderBoard() tried to re-focus
    // the replacement control while it was still marked busy, and the
    // browser silently refused). aria-disabled keeps it focusable while the
    // delegated handlers below guard against a duplicate activation
    // (OpenClaw's review).
    return `
      <div class="checklist-item${err ? " checklist-error" : ""}" data-item-id="${it.id}">
        <input type="checkbox" ${it.done ? "checked" : ""} ${busy ? 'aria-disabled="true"' : ""}
               data-task-id="${t.id}" data-item-id="${it.id}" aria-label="${esc(it.text)}">
        <span class="item-text ${it.done ? "done" : ""}">${esc(it.text)}</span>
        ${err ? `<span class="item-error-msg" role="alert">${err.action === "delete" ? "Delete failed." : "Update failed."}</span>
                 <button type="button" class="item-retry" data-task-id="${t.id}" data-item-id="${it.id}"
                         data-action="${err.action}" data-desired-done="${err.desiredDone ? "1" : "0"}">Retry</button>` : ""}
        <button type="button" class="item-delete" data-task-id="${t.id}" data-item-id="${it.id}"
                ${busy ? 'aria-disabled="true"' : ""} aria-label="Delete checklist item: ${esc(it.text)}">&times;</button>
      </div>`;
  }).join("");
  const addErr = checklistAddErrors.get(t.id);
  const pendingText = checklistAddPending.get(t.id);
  const addBusy = pendingText !== undefined;
  const inputValue = addBusy ? pendingText : (addErr ? addErr.text : "");
  const atLimit = items.length >= CHECKLIST_MAX_ITEMS;
  return `
    <div class="checklist">
      ${progress.total ? `<div class="checklist-progress">${progress.done}/${progress.total} checked off</div>` : ""}
      ${items.length ? `<div class="checklist-items">${itemsHtml}</div>` : ""}
      ${atLimit
        ? `<div class="checklist-limit">Checklist limit reached (${CHECKLIST_MAX_ITEMS}/${CHECKLIST_MAX_ITEMS})</div>`
        : `<form class="checklist-add" data-task-id="${t.id}">
             <input type="text" maxlength="300" placeholder="Add checklist item…"
                    aria-label="New checklist item for task #${t.id}" value="${esc(inputValue)}"
                    ${addBusy ? 'readonly aria-disabled="true"' : ""}>
             <button type="submit" ${addBusy ? 'aria-disabled="true"' : ""}>Add</button>
           </form>
           ${addErr ? `<div class="checklist-add-error">${esc(addErr.message)}</div>` : ""}`}
    </div>`;
}

// Mirrors app.py's MAX_ATTACHMENTS_PER_TASK -- display convenience only,
// same as CHECKLIST_MAX_ITEMS above; the server is the real boundary.
const ATTACHMENT_MAX_COUNT = 20;

function attachmentsHtml(t) {
  const attachments = t.attachments || [];
  const itemsHtml = attachments.map(a => {
    const key = `${t.id}:${a.id}`;
    const busy = pendingAttachmentDeletes.has(key);
    const err = attachmentDeleteErrors.get(key);
    return `
      <div class="attachment-item${err ? " attachment-error" : ""}" data-attachment-id="${a.id}">
        <a class="attachment-link" href="/api/tasks/${t.id}/attachments/${a.id}/download">${esc(a.filename)}</a>
        <span class="attachment-meta">${fmtBytes(a.size_bytes)} &middot; ${esc(a.uploaded_by || "?")} &middot; ${fmtTime(a.created_at)}</span>
        ${err ? `<span class="item-error-msg" role="alert">Delete failed.</span>
                 <button type="button" class="attachment-retry" data-task-id="${t.id}" data-attachment-id="${a.id}">Retry</button>` : ""}
        <button type="button" class="attachment-delete" data-task-id="${t.id}" data-attachment-id="${a.id}"
                ${busy ? 'aria-disabled="true"' : ""} aria-label="Delete attachment: ${esc(a.filename)}">&times;</button>
      </div>`;
  }).join("");
  const uploadErr = attachmentUploadErrors.get(t.id);
  const uploadingName = attachmentUploadPending.get(t.id);
  const uploadBusy = uploadingName !== undefined;
  const atLimit = attachments.length >= ATTACHMENT_MAX_COUNT;
  return `
    <div class="attachments">
      ${attachments.length ? `<div class="attachment-list">${itemsHtml}</div>` : ""}
      ${atLimit
        ? `<div class="checklist-limit">Attachment limit reached (${ATTACHMENT_MAX_COUNT}/${ATTACHMENT_MAX_COUNT})</div>`
        : `<form class="attachment-add" data-task-id="${t.id}" enctype="multipart/form-data">
             <input type="file" aria-label="Add attachment to task #${t.id}" ${uploadBusy ? 'readonly aria-disabled="true"' : ""}>
             <button type="submit" ${uploadBusy ? 'aria-disabled="true"' : ""}>${uploadBusy ? "Uploading…" : "Attach"}</button>
           </form>
           ${uploadBusy ? `<div class="attachment-uploading">Uploading ${esc(uploadingName)}…</div>` : ""}
           ${uploadErr ? `<div class="checklist-add-error">${esc(uploadErr.message)} <button type="button" class="attachment-upload-retry" data-task-id="${t.id}">Retry</button></div>` : ""}`}
    </div>`;
}

// Comments used to exist only in the data (get_task/full_state hydrate them,
// task_commented already flows through the live-event pipeline the same as
// task_updated) but were never rendered anywhere on the board -- the only way
// to see one was the raw API or a lucky search hit. This is purely the
// missing display + a composer, same shape as the checklist add form.
function commentsHtml(t) {
  const comments = t.comments || [];
  const itemsHtml = comments.map(c => `
      <div class="comment-item">
        <div class="chead"><b>${esc(c.author || "?")}</b> &middot; <time>${fmtTime(c.created_at)}</time></div>
        <div class="ctext">${esc(c.text)}</div>
      </div>`).join("");
  const err = commentAddErrors.get(t.id);
  const pendingText = commentAddPending.get(t.id);
  const addBusy = pendingText !== undefined;
  const inputValue = addBusy ? pendingText : (err ? err.text : "");
  return `
    <div class="comments">
      ${comments.length ? `<div class="comment-list">${itemsHtml}</div>` : ""}
      <form class="comment-add" data-task-id="${t.id}">
        <input type="text" maxlength="4000" placeholder="Add a comment…"
               aria-label="New comment on task #${t.id}" value="${esc(inputValue)}"
               ${addBusy ? 'readonly aria-disabled="true"' : ""}>
        <button type="submit" ${addBusy ? 'aria-disabled="true"' : ""}>Comment</button>
      </form>
      ${err ? `<div class="comment-add-error">${esc(err.message)}</div>` : ""}
    </div>`;
}

function taskCompleteHtml(t) {
  if (t.status === "done") return "";
  const busy = taskCompletePending.has(t.id);
  const err = taskCompleteErrors.get(t.id);
  return `
    <div class="task-complete">
      <button type="button" class="task-complete-btn" data-task-id="${t.id}"
              ${busy ? 'aria-disabled="true"' : ""}>${busy ? "Marking done…" : "Mark done"}</button>
      ${err ? `<span class="task-complete-error" role="alert">${esc(err.message)}
        <button type="button" class="task-complete-retry" data-task-id="${t.id}">Retry</button></span>` : ""}
    </div>`;
}

function taskCard(t) {
  const overdue = t.due_date && t.status !== "done" && isOverdue(t.due_date);
  return `
    <div class="card" data-task-id="${t.id}">
      <div class="title">#${t.id} ${esc(t.title)}</div>
      ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ""}
      <div class="meta">
        <span class="badge ${t.status}">${t.status.replace("_"," ")}</span>
        <span class="priority ${t.priority || "normal"}">${t.priority || "normal"}</span>
        ${t.due_date ? `<span class="due-date ${overdue ? "overdue" : ""}">${overdue ? "Overdue: " : "Due "}${fmtDueDate(t.due_date)}</span>` : ""}
        ${t.assignee ? `<span class="assignee">${esc(t.assignee)}</span>` : ""}
        <span>by ${esc(t.created_by || "?")}</span>
        <time>${fmtTime(t.updated_at)}</time>
      </div>
      ${taskCompleteHtml(t)}
      ${checklistHtml(t)}
      ${attachmentsHtml(t)}
      ${commentsHtml(t)}
    </div>`;
}

function renderBoard() {
  const board = document.getElementById("board");
  // Preserve focus across the full innerHTML replacement below -- otherwise
  // every checklist checkbox/delete click, or a live event landing while a
  // column's collapse toggle is focused, drops keyboard focus back to
  // <body>, breaking keyboard-only use (OpenClaw's review, both tranches).
  const active = document.activeElement;
  let restore = null;
  if (active && board.contains(active)) {
    const checklistAddForm = active.closest(".checklist-add");
    const attachmentAddForm = active.closest(".attachment-add");
    const commentAddForm = active.closest(".comment-add");
    if (active.dataset.taskId && active.dataset.itemId) {
      restore = { type: "checklist", tag: active.tagName.toLowerCase(), taskId: active.dataset.taskId, itemId: active.dataset.itemId };
    } else if (active.dataset.taskId && active.dataset.attachmentId) {
      restore = { type: "attachment", tag: active.tagName.toLowerCase(), taskId: active.dataset.taskId, attachmentId: active.dataset.attachmentId };
    } else if (checklistAddForm) {
      // The add input/button carry no data-task-id of their own (only the
      // <form> does) -- without this branch, focus on either one was simply
      // never preserved at all, including the specific case OpenClaw asked
      // for: a failed add should return focus to its own input so the
      // retained text + inline error are immediately actionable.
      restore = { type: "checklist-add", tag: active.tagName.toLowerCase(), taskId: checklistAddForm.dataset.taskId };
    } else if (attachmentAddForm) {
      restore = { type: "attachment-add", tag: active.tagName.toLowerCase(), taskId: attachmentAddForm.dataset.taskId };
    } else if (commentAddForm) {
      restore = { type: "comment-add", tag: active.tagName.toLowerCase(), taskId: commentAddForm.dataset.taskId };
    } else if (active.classList.contains("collapse-toggle") && active.dataset.sectionId) {
      restore = { type: "collapse-toggle", sectionId: active.dataset.sectionId };
    }
  }

  const tasks = [...tasksById.values()].sort((a, b) => (a.updated_at < b.updated_at ? 1 : -1));
  const groups = { open: [], claimed: [], in_progress: [], blocked: [], done: [] };
  for (const t of tasks) (groups[t.status] || groups.open).push(t);

  const cols = [...COLUMNS];
  if (groups.done.length) cols.push(["done", "Done"]);

  board.innerHTML = cols.map(([key, label]) => `
    <div class="col" id="col-${key}">
      <h2>${label} <span class="count">${groups[key].length}</span>
        <button type="button" class="collapse-toggle" data-section-id="column:${key}" data-section-label="${esc(label)} column"
                aria-controls="col-body-${key}" aria-expanded="true" aria-label="Collapse ${esc(label)} column">&#9662;</button>
      </h2>
      <div class="col-body" id="col-body-${key}">
        ${groups[key].length ? groups[key].map(taskCard).join("") : `<div class="empty">nothing here</div>`}
      </div>
    </div>
  `).join("");
  renderNewCount("tasks");
  // Re-apply persisted collapse state -- the template above always renders
  // "expanded" markup; this is the one place that reconciles it against
  // collapsedSections, so board regeneration never silently resets a
  // column back open.
  applyAllCollapseState();

  if (restore) {
    let el = null;
    if (restore.type === "checklist") {
      el = board.querySelector(`${restore.tag}[data-task-id="${restore.taskId}"][data-item-id="${restore.itemId}"]`);
    } else if (restore.type === "attachment") {
      el = board.querySelector(`${restore.tag}[data-task-id="${restore.taskId}"][data-attachment-id="${restore.attachmentId}"]`);
      // A deleted attachment's own controls are simply gone -- same as a
      // deleted checklist item, nothing meaningful to restore focus to.
    } else if (restore.type === "checklist-add") {
      const form = board.querySelector(`.checklist-add[data-task-id="${restore.taskId}"]`);
      el = form ? form.querySelector(restore.tag) : null;
      // The add form disappears entirely once the item-count cap is hit --
      // nothing meaningful to restore focus to in that case, same as a
      // deleted checklist item.
    } else if (restore.type === "attachment-add") {
      const form = board.querySelector(`.attachment-add[data-task-id="${restore.taskId}"]`);
      el = form ? form.querySelector(restore.tag) : null;
    } else if (restore.type === "comment-add") {
      const form = board.querySelector(`.comment-add[data-task-id="${restore.taskId}"]`);
      el = form ? form.querySelector(restore.tag) : null;
    } else if (restore.type === "collapse-toggle") {
      el = board.querySelector(`.collapse-toggle[data-section-id="${restore.sectionId}"]`);
      if (!el) {
        // The exact column can vanish out from under a focused toggle -- the
        // "Done" column, in particular, only exists while at least one task
        // is done, so completing the last visible done task removes it.
        // Fall back to another surviving column toggle, or the board header
        // itself, rather than silently dropping focus to <body>
        // (OpenClaw's review).
        el = board.querySelector('.collapse-toggle[data-section-id^="column:"]') || document.getElementById("boardHeader");
      }
    }
    if (el) {
      // .item-delete/.attachment-delete are visibility:hidden until their
      // row is hovered or has :focus-within -- a real user always reaches
      // one by hovering or Tab-ing through the (always-visible) preceding
      // control first, which naturally reveals it before focus lands. This
      // restore path calls .focus() directly, skipping that reveal step --
      // and a browser refuses to focus a visibility:hidden element at all,
      // silently leaving focus wherever it was. That's invisible in the
      // common case (the row was already hovered/focused a moment ago,
      // e.g. right after clicking delete, so :hover/:focus-within is still
      // active when the re-render happens), but breaks the instant an
      // UNRELATED re-render shifts the row to a different screen position
      // (e.g. a sibling field changing the card's height moves the row out
      // from under a still-hovering mouse) -- caught by a dedicated
      // Playwright scenario forcing exactly that unrelated re-render, not
      // just the same-interaction case every earlier test happened to
      // cover. Force it visible immediately before focusing; the CSS
      // :focus-within rule then keeps it visible for as long as focus
      // actually stays there, and the next full renderBoard() regenerates
      // the element from the template anyway, discarding this override
      // (OpenClaw's review pattern applied preemptively here).
      if (el.classList.contains("item-delete") || el.classList.contains("attachment-delete")) {
        el.style.visibility = "visible";
      }
      el.focus();
    }
  }
}

// --- checklist interactions ---------------------------------------------
// Event delegation on the persistent #board container (attached once below,
// not re-bound after every renderBoard()'s innerHTML replacement) -- same
// pattern the codebase already uses for header click-to-clear elsewhere.

async function toggleChecklistItem(taskId, itemId, done) {
  const key = `${taskId}:${itemId}`;
  pendingChecklistOps.add(key);
  checklistItemErrors.delete(key);
  renderBoard();
  try {
    const res = await fetch(`/api/tasks/${taskId}/checklist/${itemId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ done }),
    });
    if (!res.ok) throw new Error(String(res.status));
    const task = await fetchTask(taskId);
    if (task) tasksById.set(task.id, task);
  } catch {
    // Leave tasksById untouched -- since we never mutated it optimistically,
    // the re-render below reverts the checkbox to the last known-good
    // server state on its own; never a blind manual invert. Surface it
    // visibly instead of failing silently (OpenClaw's review).
    checklistItemErrors.set(key, { action: "toggle", desiredDone: done });
  } finally {
    pendingChecklistOps.delete(key);
    renderBoard();
  }
}

async function deleteChecklistItem(taskId, itemId) {
  const key = `${taskId}:${itemId}`;
  pendingChecklistOps.add(key);
  checklistItemErrors.delete(key);
  renderBoard();
  try {
    const res = await fetch(`/api/tasks/${taskId}/checklist/${itemId}`, { method: "DELETE" });
    if (!res.ok) throw new Error(String(res.status));
    const task = await fetchTask(taskId);
    if (task) tasksById.set(task.id, task);
  } catch {
    // ditto -- leave tasksById alone, the item reappears on re-render, and
    // flag it with a visible Retry rather than silently doing nothing.
    checklistItemErrors.set(key, { action: "delete" });
  } finally {
    pendingChecklistOps.delete(key);
    renderBoard();
  }
}

async function addChecklistItem(taskId, text) {
  checklistAddPending.set(taskId, text);
  checklistAddErrors.delete(taskId);
  renderBoard(); // reflects the busy add-button state below immediately
  try {
    const res = await fetch(`/api/tasks/${taskId}/checklist`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      checklistAddErrors.set(taskId, { text, message: body.error || "Could not add checklist item." });
      return;
    }
    const task = await fetchTask(taskId);
    if (task) tasksById.set(task.id, task);
    // Success -- checklistAddErrors has no entry for this task, so the
    // re-render below regenerates the form with an empty input.
  } catch {
    // A network failure (fetch itself throwing) previously had no catch at
    // all here, which meant an unhandled promise rejection AND the input
    // had already been cleared before the request even started -- the
    // user's typed text was just gone. Now caught, text preserved via
    // checklistAddErrors, and shown inline instead of alert() (OpenClaw's
    // review).
    checklistAddErrors.set(taskId, { text, message: "Network error -- check your connection and try again." });
  } finally {
    checklistAddPending.delete(taskId);
    renderBoard();
  }
}

document.getElementById("board").addEventListener("change", (e) => {
  const cb = e.target.closest('input[type="checkbox"][data-item-id]');
  if (!cb) return;
  if (cb.getAttribute("aria-disabled") === "true") {
    // A request for this exact item is already in flight -- revert the
    // native toggle the click just made (aria-disabled keeps the control
    // focusable, unlike the `disabled` attribute, but does not itself block
    // the click/change from firing, so this guard does that instead) and
    // don't fire a duplicate request.
    cb.checked = !cb.checked;
    return;
  }
  toggleChecklistItem(Number(cb.dataset.taskId), Number(cb.dataset.itemId), cb.checked);
});
document.getElementById("board").addEventListener("click", (e) => {
  const retryBtn = e.target.closest(".item-retry");
  if (retryBtn) {
    const taskId = Number(retryBtn.dataset.taskId), itemId = Number(retryBtn.dataset.itemId);
    if (retryBtn.dataset.action === "delete") deleteChecklistItem(taskId, itemId);
    else toggleChecklistItem(taskId, itemId, retryBtn.dataset.desiredDone === "1");
    return;
  }
  const delBtn = e.target.closest(".item-delete");
  if (delBtn) {
    if (delBtn.getAttribute("aria-disabled") === "true") return; // already in flight
    // The button is tiny and revealed on hover/focus -- easy to hit by
    // accident, so confirm before an unrecoverable delete (OpenClaw's
    // review suggestion).
    const label = (delBtn.getAttribute("aria-label") || "").replace(/^Delete checklist item: /, "");
    if (!confirm(`Delete this checklist item?\n\n${label}`)) return;
    deleteChecklistItem(Number(delBtn.dataset.taskId), Number(delBtn.dataset.itemId));
  }
});
document.getElementById("board").addEventListener("submit", (e) => {
  const form = e.target.closest(".checklist-add");
  if (!form) return;
  e.preventDefault();
  if (form.querySelector('button[aria-disabled="true"]')) return; // already submitting
  const input = form.querySelector("input");
  const text = input.value.trim();
  if (!text) return;
  // Do NOT clear input.value here -- addChecklistItem only regenerates the
  // form (via renderBoard) once the request settles, reading the preserved
  // text back out of checklistAddErrors on failure or an empty value on
  // success. Clearing it eagerly, as before, meant a failed request lost
  // the user's typed text permanently (OpenClaw's review).
  addChecklistItem(Number(form.dataset.taskId), text);
});

// --- comment interactions -------------------------------------------------
// Same pending/error/retain-on-failure shape as addChecklistItem above,
// just posting to /api/tasks/{id}/comment. Author comes from the same
// shared "Your name" field the task/note/chat composers use (defined
// further down, near those) -- getAuthorName() is safe to call before its
// own definition runs since this only executes on a later submit event,
// well after the whole script has finished evaluating.
async function addComment(taskId, text) {
  const author = getAuthorName();
  if (!author) {
    commentAddErrors.set(taskId, { text, message: "Enter your name at the top of the page first." });
    renderBoard();
    return;
  }
  commentAddPending.set(taskId, text);
  commentAddErrors.delete(taskId);
  renderBoard();
  try {
    const res = await fetch(`/api/tasks/${taskId}/comment`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ author, text }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      commentAddErrors.set(taskId, { text, message: body.error || "Could not add comment." });
      return;
    }
    const task = await fetchTask(taskId);
    if (task) tasksById.set(task.id, task);
  } catch {
    commentAddErrors.set(taskId, { text, message: "Network error -- check your connection and try again." });
  } finally {
    commentAddPending.delete(taskId);
    renderBoard();
  }
}

document.getElementById("board").addEventListener("submit", (e) => {
  const form = e.target.closest(".comment-add");
  if (!form) return;
  e.preventDefault();
  if (form.querySelector('button[aria-disabled="true"]')) return; // already submitting
  const input = form.querySelector("input");
  const text = input.value.trim();
  if (!text) return;
  addComment(Number(form.dataset.taskId), text);
});

// --- attachment interactions ---------------------------------------------

async function uploadAttachment(taskId, file) {
  attachmentUploadPending.set(taskId, file.name);
  attachmentUploadErrors.delete(taskId);
  renderBoard();
  try {
    const fd = new FormData();
    fd.append("file", file);
    const res = await fetch(`/api/tasks/${taskId}/attachments`, { method: "POST", body: fd });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      attachmentUploadErrors.set(taskId, { file, message: body.error || "Upload failed." });
      return;
    }
    const task = await fetchTask(taskId);
    if (task) tasksById.set(task.id, task);
    // Success -- attachmentUploadErrors has no entry for this task, so the
    // re-render below regenerates the form with an empty file input.
  } catch {
    // Network failure -- same treatment as the checklist add form: keep
    // the actual File object (not just its name) so Retry can resubmit it
    // without asking the user to re-pick the file from their filesystem.
    attachmentUploadErrors.set(taskId, { file, message: "Network error -- check your connection and try again." });
  } finally {
    attachmentUploadPending.delete(taskId);
    renderBoard();
  }
}

async function deleteAttachment(taskId, attachmentId) {
  const key = `${taskId}:${attachmentId}`;
  pendingAttachmentDeletes.add(key);
  attachmentDeleteErrors.delete(key);
  renderBoard();
  try {
    const res = await fetch(`/api/tasks/${taskId}/attachments/${attachmentId}`, { method: "DELETE" });
    if (!res.ok) throw new Error(String(res.status));
    const task = await fetchTask(taskId);
    if (task) tasksById.set(task.id, task);
  } catch {
    attachmentDeleteErrors.set(key, true);
  } finally {
    pendingAttachmentDeletes.delete(key);
    renderBoard();
  }
}

document.getElementById("board").addEventListener("submit", (e) => {
  const form = e.target.closest(".attachment-add");
  if (!form) return;
  e.preventDefault();
  if (form.querySelector('button[aria-disabled="true"]')) return; // already uploading
  const input = form.querySelector('input[type="file"]');
  const file = input.files && input.files[0];
  if (!file) return;
  uploadAttachment(Number(form.dataset.taskId), file);
});
document.getElementById("board").addEventListener("click", (e) => {
  const uploadRetryBtn = e.target.closest(".attachment-upload-retry");
  if (uploadRetryBtn) {
    const taskId = Number(uploadRetryBtn.dataset.taskId);
    const err = attachmentUploadErrors.get(taskId);
    if (err) uploadAttachment(taskId, err.file);
    return;
  }
  const attachRetryBtn = e.target.closest(".attachment-retry");
  if (attachRetryBtn) {
    deleteAttachment(Number(attachRetryBtn.dataset.taskId), Number(attachRetryBtn.dataset.attachmentId));
    return;
  }
  const delBtn = e.target.closest(".attachment-delete");
  if (delBtn) {
    if (delBtn.getAttribute("aria-disabled") === "true") return; // already in flight
    const item = delBtn.closest(".attachment-item");
    const filename = item ? item.querySelector(".attachment-link").textContent : "";
    if (!confirm(`Delete this attachment?\n\n${filename}`)) return;
    deleteAttachment(Number(delBtn.dataset.taskId), Number(delBtn.dataset.attachmentId));
  }
});

// --- task completion -------------------------------------------------------
// Lets the human close a task straight from the dashboard -- previously the
// only way was asking one of the agents to call complete_task on your
// behalf. Posts to the same /api/tasks/{id}/complete route the MCP tool and
// its REST mirror already use, so no new backend surface. getAuthorName()
// is defined further down (safe -- this only runs on a later click, well
// after the whole script has evaluated, same as addComment above).

async function completeTask(taskId, summary) {
  taskCompletePending.add(taskId);
  taskCompleteErrors.delete(taskId);
  renderBoard();
  try {
    const author = getAuthorName();
    const res = await fetch(`/api/tasks/${taskId}/complete`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ author, summary }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      taskCompleteErrors.set(taskId, { summary, message: body.error || "Could not mark this task done." });
      return;
    }
    const task = await fetchTask(taskId);
    if (task) tasksById.set(task.id, task);
  } catch {
    taskCompleteErrors.set(taskId, { summary, message: "Network error -- check your connection and try again." });
  } finally {
    taskCompletePending.delete(taskId);
    renderBoard();
  }
}

document.getElementById("board").addEventListener("click", (e) => {
  const retryBtn = e.target.closest(".task-complete-retry");
  if (retryBtn) {
    const taskId = Number(retryBtn.dataset.taskId);
    const err = taskCompleteErrors.get(taskId);
    completeTask(taskId, err ? err.summary : "");
    return;
  }
  const btn = e.target.closest(".task-complete-btn");
  if (!btn) return;
  if (btn.getAttribute("aria-disabled") === "true") return; // already in flight
  const taskId = Number(btn.dataset.taskId);
  if (!getAuthorName()) {
    taskCompleteErrors.set(taskId, { summary: "", message: "Enter your name at the top of the page first." });
    renderBoard();
    return;
  }
  // prompt() doubles as the confirm-before-an-action-you-can't-undo-from-
  // here step (same reasoning as the attachment/checklist delete confirms)
  // -- Cancel returns null and aborts, OK with an empty note still proceeds.
  const note = prompt(`Mark task #${taskId} as done?\n\nOptional closing note (leave blank for none):`);
  if (note === null) return;
  completeTask(taskId, note.trim());
});

// --- human composers: add task / post note / send chat --------------------
// All three POST to the same REST endpoints the two agents already use
// (create_task/post_note/start+send_chat_message's mirrors) -- no new
// backend surface, so no new security/validation boundary to design here.
// One shared "author name" field (not one per form) is the load-bearing
// identity for all three; it's what shows up next to your tasks/notes/chat
// messages and in the Presence panel, same as "claude"/"openclaw" do.

const AUTHOR_STORAGE_KEY = "collabhub.authorName";
function getAuthorName() {
  return (document.getElementById("authorNameInput").value || "").trim();
}
(function initAuthorName() {
  const el = document.getElementById("authorNameInput");
  try { el.value = localStorage.getItem(AUTHOR_STORAGE_KEY) || ""; } catch { /* private mode / disabled storage -- just start blank */ }
  el.addEventListener("input", () => {
    try { localStorage.setItem(AUTHOR_STORAGE_KEY, el.value); } catch { /* not worth surfacing for a display convenience */ }
  });
})();

// --- add task ---------------------------------------------------------
const addTaskToggle = document.getElementById("addTaskToggle");
const taskComposer = document.getElementById("taskComposer");
addTaskToggle.addEventListener("click", () => {
  const opening = taskComposer.hidden;
  taskComposer.hidden = !opening;
  addTaskToggle.setAttribute("aria-expanded", String(opening));
  addTaskToggle.textContent = opening ? "Cancel" : "+ Add task";
  if (opening) document.getElementById("newTaskTitle").focus();
});

let newTaskSubmitting = false;
document.getElementById("newTaskForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (newTaskSubmitting) return;
  const errEl = document.getElementById("newTaskError");
  errEl.style.display = "none";
  const title = document.getElementById("newTaskTitle").value.trim();
  if (!title) {
    errEl.textContent = "Title is required.";
    errEl.style.display = "";
    return;
  }
  const author = getAuthorName();
  if (!author) {
    errEl.textContent = "Enter your name at the top of the page first.";
    errEl.style.display = "";
    return;
  }
  const description = document.getElementById("newTaskDesc").value.trim();
  const priority = document.getElementById("newTaskPriority").value;
  const dueDate = document.getElementById("newTaskDue").value || null;
  newTaskSubmitting = true;
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.setAttribute("aria-disabled", "true");
  try {
    const res = await fetch("/api/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, description, created_by: author, priority, due_date: dueDate }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      errEl.textContent = body.error || "Could not create task.";
      errEl.style.display = "";
      return;
    }
    // Apply directly from the response rather than waiting on the SSE
    // task_created event -- that event still arrives and re-applies the
    // same task (fetchTask by id, idempotent set), but the composer
    // shouldn't feel like it's waiting on the live connection to work.
    tasksById.set(body.id, body);
    renderBoard();
    e.target.reset();
    taskComposer.hidden = true;
    addTaskToggle.setAttribute("aria-expanded", "false");
    addTaskToggle.textContent = "+ Add task";
  } catch {
    errEl.textContent = "Network error -- check your connection and try again.";
    errEl.style.display = "";
  } finally {
    newTaskSubmitting = false;
    submitBtn.removeAttribute("aria-disabled");
  }
});

// --- post note ----------------------------------------------------------
let newNoteSubmitting = false;
document.getElementById("newNoteForm").addEventListener("submit", async (e) => {
